<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dassein</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05080f;
      overflow: hidden;
      font-family: "Playfair Display", serif;
      cursor: default;
    }

    #scene {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
    }

    #overlay {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
    }

    #overlay h1 {
      color: #d7e1ee;
      font-family: "Playfair Display", serif;
      font-size: clamp(56px, 10vw, 120px);
      font-weight: 700;
      letter-spacing: -0.03em;
      opacity: 0.85;
    }

    #overlay p {
      color: #7286a0;
      font-family: "Caveat", cursive;
      font-size: 22px;
      margin-top: 12px;
      opacity: 0.6;
    }

    #tooltip {
      position: fixed; z-index: 2;
      pointer-events: none;
      color: #d7e1ee;
      font-family: "Caveat", cursive;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.25s;
      transform: translate(-50%, -50%);
      text-shadow: 0 0 12px rgba(61, 255, 184, 0.4);
    }

    #tooltip.visible { opacity: 1; }
  </style>
</head>
<body>

  <canvas id="scene"></canvas>

  <div id="overlay">
    <h1>Dassein</h1>
    <p>a clearing</p>
  </div>

  <div id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
  <script>
    const canvas = document.getElementById('scene');

    // --- Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080f);
    scene.fog = new THREE.FogExp2(0x05080f, 0.00015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    // --- Lights ---
    const ambientLight = new THREE.AmbientLight(0x334466, 0.4);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x3dffb8, 8, 20);
    pointLight.position.set(0, 0, 2);
    scene.add(pointLight);

    // --- Particles ---
    const PARTICLE_COUNT = 2000;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const r = Math.cbrt(Math.random()) * 12;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.015,
      color: 0x7286a0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.6,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // --- Torus Knot (central mark) ---
    const knotGeo = new THREE.TorusKnotGeometry(0.7, 0.15, 200, 32);
    const knotMat = new THREE.MeshStandardMaterial({
      color: 0x3dffb8,
      roughness: 0.3,
      metalness: 0.1,
      emissive: 0x3dffb8,
      emissiveIntensity: 0.15,
    });
    const knot = new THREE.Mesh(knotGeo, knotMat);
    knot.position.set(0, 0.2, 0);
    scene.add(knot);

    // --- Orbit Group (contains nav shapes) ---
    const orbitGroup = new THREE.Group();
    scene.add(orbitGroup);

    // --- Icosahedron (Wylan link) ---
    const icoGeo = new THREE.IcosahedronGeometry(0.35, 1);
    const icoMat = new THREE.MeshStandardMaterial({
      color: 0x58c4ff,
      wireframe: true,
      emissive: 0x58c4ff,
      emissiveIntensity: 0.1,
    });
    const icosahedron = new THREE.Mesh(icoGeo, icoMat);
    icosahedron.position.set(2.2, 0.3, 0);
    orbitGroup.add(icosahedron);

    // --- Ribbon tube (Blogs link) ---
    const ribbonStart = new THREE.Vector3(0, 0, 0);
    const ribbonC1 = new THREE.Vector3(-1.2, 1.2, -0.8);
    const ribbonC2 = new THREE.Vector3(-2.5, 0.3, 0.5);
    const ribbonEnd = new THREE.Vector3(-2.0, -0.2, 1.2);
    const ribbonCurve = new THREE.CubicBezierCurve3(ribbonStart, ribbonC1, ribbonC2, ribbonEnd);
    const ribbonGeo = new THREE.TubeGeometry(ribbonCurve, 48, 0.03, 8, false);
    const ribbonMat = new THREE.MeshStandardMaterial({
      color: 0xb79cff,
      emissive: 0xb79cff,
      emissiveIntensity: 0.1,
    });
    const ribbonMesh = new THREE.Mesh(ribbonGeo, ribbonMat);
    orbitGroup.add(ribbonMesh);

    // --- Raycasting ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('tooltip');

    const clickables = [
      { mesh: icosahedron, url: '/wylan.html', label: 'wylan' },
      { mesh: ribbonMesh, url: '/blogs.html', label: 'forest paths' },
    ];

    let hoveredMesh = null;

    function getClickableTarget(obj) {
      return clickables.find(c => c.mesh === obj);
    }

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const meshes = clickables.map(c => c.mesh);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const obj = intersects[0].object;
        const target = getClickableTarget(obj);
        if (target) {
          document.body.style.cursor = 'pointer';
          tooltip.textContent = target.label;
          tooltip.classList.add('visible');
          tooltip.style.left = e.clientX + 'px';
          tooltip.style.top = (e.clientY - 30) + 'px';
          hoveredMesh = obj;
        }
      } else {
        document.body.style.cursor = 'default';
        tooltip.classList.remove('visible');
        hoveredMesh = null;
      }
    });

    window.addEventListener('click', () => {
      if (hoveredMesh) {
        const target = getClickableTarget(hoveredMesh);
        if (target) window.location.href = target.url;
      }
    });

    // --- Resize ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // --- RAF Loop ---
    const vec3 = new THREE.Vector3();

    function raf(time) {
      const t = time * 0.001;

      // Torus knot auto-rotation
      knot.rotation.x += 0.003;
      knot.rotation.y += 0.005;
      knot.rotation.z += 0.001;

      // Orbit group rotates
      orbitGroup.rotation.y += 0.002;

      // Camera idle breathing
      camera.position.y = Math.sin(t * 0.3) * 0.15;
      camera.position.z = 8 + Math.sin(t * 0.4) * 0.3;
      camera.lookAt(0, 0, 0);

      // Hover effects — smooth interpolation
      if (hoveredMesh) {
        hoveredMesh.scale.lerp(new THREE.Vector3(1.2, 1.2, 1.2), 0.1);
        if (hoveredMesh.material && hoveredMesh.material.emissiveIntensity !== undefined) {
          hoveredMesh.material.emissiveIntensity += (0.5 - hoveredMesh.material.emissiveIntensity) * 0.1;
        }
      }
      clickables.forEach(c => {
        if (c.mesh !== hoveredMesh) {
          c.mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
          if (c.mesh.material && c.mesh.material.emissiveIntensity !== undefined) {
            c.mesh.material.emissiveIntensity += (0.1 - c.mesh.material.emissiveIntensity) * 0.1;
          }
        }
      });

      renderer.render(scene, camera);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
  </script>
</body>
</html>
