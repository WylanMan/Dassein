<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dassein</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Caveat:wght@400;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05080f;
      overflow: hidden;
      font-family: "Space Grotesk", system-ui, sans-serif;
      cursor: default;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(1200px 800px at 50% 32%, #0c0c14, #06060a);
    }
    #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
    #overlay {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #overlay h1 {
      color: #b9b6c2; font-family: "Playfair Display", serif;
      font-size: clamp(56px, 10vw, 120px); font-weight: 700;
      letter-spacing: -0.03em; opacity: 0.85;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 20px 10vw;
      background: rgba(5, 8, 15, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0; transition: opacity 0.6s ease;
      pointer-events: none;
    }
    nav.visible { opacity: 1; pointer-events: all; }
    nav ul { list-style: none; display: flex; gap: 28px; align-items: center; font-family: "Caveat", cursive; font-size: 18px; }
    nav li:first-child { color: #b9b6c2; }
    nav a { color: #9a97a3; text-decoration: none; transition: color 0.3s; }
    nav a.active, nav span.active { color: #00d4ff; cursor: default; }

    #agent-ui {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 32px 40px; gap: 14px;
      opacity: 0; transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #agent-ui.visible { opacity: 1; pointer-events: all; }

    .stage {
      width: min(78vmin, 600px); aspect-ratio: 1;
      border-radius: 50%; overflow: hidden; position: relative;
      box-shadow: 0 0 60px -10px rgba(0, 212, 255, 0.08), 0 20px 60px -15px rgba(0, 0, 0, 0.8);
    }
    .stage canvas { display: block; width: 100%; height: 100%; }
    .stage::after {
      content: ''; position: absolute; inset: 0; z-index: 1;
      border-radius: 50%;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 212, 255, 0.015) 2px, rgba(0, 212, 255, 0.015) 4px),
                        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 212, 255, 0.015) 2px, rgba(0, 212, 255, 0.015) 4px);
      pointer-events: none;
    }

    .caption {
      display: flex; gap: 9px; align-items: center;
      font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #9a97a3; font-family: "Caveat", cursive;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #00d4ff; box-shadow: 0 0 12px #00d4ff; animation: pulse 2.4s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .convo {
      min-height: 20px; max-width: 480px; text-align: center;
      font-size: 14px; color: #9a97a3; line-height: 1.5;
      max-height: 36vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
      padding: 0 16px;
    }
    .msg-line {
      max-width: 85%; padding: 8px 14px; border-radius: 16px;
      font-size: 13px; line-height: 1.45; word-break: break-word;
    }
    .msg-line.user {
      align-self: flex-end;
      background: rgba(0, 212, 255, 0.08); color: #b9b6c2;
      border: 1px solid rgba(0, 212, 255, 0.12);
    }
    .msg-line.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.03); color: #b9b6c2;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .msg-line.streaming::after {
      content: '|'; animation: blink-cursor 0.7s infinite;
      color: #00d4ff; font-weight: bold;
    }
    @keyframes blink-cursor {
      50% { opacity: 0; }
    }

    .bar { display: flex; gap: 10px; align-items: center; }
    .bar input[type=text] {
      background: #111118; color: #b9b6c2;
      border: 1px solid rgba(0, 212, 255, 0.12);
      padding: 10px 16px; border-radius: 999px;
      font: inherit; font-size: 14px;
      width: min(46vw, 320px); outline: none;
      transition: border-color 0.25s;
    }
    .bar input[type=text]:focus { border-color: rgba(0, 212, 255, 0.35); }
    button {
      background: #15151d; color: #aab4c0;
      border: 1px solid rgba(0, 212, 255, 0.12);
      padding: 9px 18px; border-radius: 999px;
      font: inherit; font-size: 13px; cursor: pointer;
      transition: all 0.25s;
    }
    button:hover { background: #1c1c28; border-color: rgba(0, 212, 255, 0.35); color: #b9b6c2; }
    #micBtn.live { background: #201518; border-color: #ff4466; color: #ffb3ba; }
    #micBtn.cont-active { background: #142218; border-color: #44ff88; color: #b3ffba; }

    .shape-row {
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.5s;
    }
    .shape-row.visible { opacity: 1; pointer-events: all; }
    .shape-pill {
      font-size: 11px; padding: 4px 12px; border-radius: 999px;
      background: rgba(0, 212, 255, 0.06); color: #9a97a3;
      border: 1px solid rgba(0, 212, 255, 0.10);
      cursor: pointer; transition: all 0.25s;
    }
    .shape-pill:hover { background: rgba(0, 212, 255, 0.12); color: #b9b6c2; border-color: rgba(0, 212, 255, 0.25); }
    .shape-pill.active { background: rgba(0, 212, 255, 0.15); color: #00d4ff; border-color: rgba(0, 212, 255, 0.40); }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="overlay">
    <h1>Dassein</h1>
  </div>

  <nav>
    <ul>
      <li>Dassein</li>
      <li><a href="#" id="navHome">home</a></li>
      <li><span id="navAgent" class="active">agent</span></li>
      <li><a href="/blogs" id="navBlogs">blogs</a></li>
    </ul>
  </nav>

  <div id="agent-ui">
    <div class="stage" id="stage">
      <canvas id="c"></canvas>
    </div>
    <div class="caption">
      <span class="dot"></span>
      <span>the questioner</span>
    </div>
    <div class="convo" id="convo">
      Ask anything. I answer in Wylan's words.
    </div>
    <div class="shape-row" id="shapeRow">
      <span class="shape-pill active" data-shape="face">face</span>
      <span class="shape-pill" data-shape="sphere">sphere</span>
      <span class="shape-pill" data-shape="cube">cube</span>
      <span class="shape-pill" data-shape="cylinder">cylinder</span>
      <span class="shape-pill" data-shape="pyramid">pyramid</span>
      <span class="shape-pill" data-shape="torus">torus</span>
    </div>
    <div class="bar">
      <input id="chatInput" type="text" placeholder="Ask me something..." autocomplete="off"/>
      <button id="sendBtn">&rarr;</button>
      <button id="micBtn">mic</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const NUM = 478;
    const FACE_SCALE = 2.8;
    const FACE_SCALE_Y = FACE_SCALE * 0.75;
    const FACE_SCALE_Z = 2.0;

    const CONTOURS = {
      faceOval: [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109],
      leftEye: [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7],
      rightEye: [362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382],
      lipsOuter: [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185],
      lipsInner: [78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95],
      leftBrow: [70,63,105,66,107,55,65,52,53,46],
      rightBrow: [300,293,334,296,336,285,295,282,283,276],
      noseBridge: [168,6,197,195,5,4,1],
      noseBottom: [1,2,98,327,1],
    };

    const KEY_NODE_INDICES = [1, 4, 6, 10, 33, 61, 63, 105, 133, 152, 159, 168, 263, 267, 291, 314, 362, 386, 397, 405, 454, 468, 473];
    const UPPER_LIDS = [159, 160, 161, 163, 386, 387, 385, 384];
    const LOWER_LIDS = [145, 144, 157, 374, 373, 390];
    const MOUTH_INNER = [13, 14, 78, 80, 81, 82, 87, 88, 95, 178, 191, 308, 310, 311, 312, 317, 318, 324, 402, 415];
    const MOUTH_OUTER = [0, 17, 37, 39, 40, 61, 91, 146, 181, 185, 267, 269, 270, 291, 314, 321, 375, 405, 409];

    let scanData = null;
    let faceLMs = null;
    let baseLMs = null;
    let workingBuffer = null;
    let state = 'landing';
    let currentShape = 'face';
    let shapeTargets = null;
    let shapeTargetEdgeIndices = null;
    let nnIndices = [];
    let faceNNIndices = [];

    // ═══ Scroll-Driven Rotation Controller ═══
    const ScrollController = (() => {
      // ── Configuration ──
      const CFG = {
        globeSpeedX: 0.0008,
        globeSpeedY: 0.0015,
        globeSpeedZ: 0.0003,
        reducedGlobeSpeedX: 0.00008,
        reducedGlobeSpeedY: 0.00015,
        reducedGlobeSpeedZ: 0.00003,
        scrollFactor: 0.00005,
        fallbackMouseFactor: 0.000015,
        damping: 0.96,
        maxSpinVelocity: 0.1,
        velocityDeadZone: 0.0005,
        faceIdleDelay: 400,
        faceSpringFast: 0.06,
        faceSpringSlow: 0.02,
        faceZoneThreshold: 0.35,
        faceSnapThreshold: 0.001,
        faceRestThreshold: 0.002,
        tapMaxMovement: 5,
        tapMaxDuration: 300,
      };

      let spinVelocity = 0;
      let globeAngleY = 0;
      let faceOffsetY = 0;
      let faceSpringActive = false;
      let faceSpringTimer = null;
      let lastScrollTime = 0;
      let consecutiveStillFrames = 0;
      let enabled = !REDUCED_MOTION;

      let touchStartX = 0, touchStartY = 0, touchStartTime = 0, touchActive = false, touchPrevX = 0;

      function handleWheel(e) {
        if (!enabled) return;
        if (typeof isAnimating !== 'undefined' && isAnimating) return;
        if (REDUCED_MOTION) return;
        e.preventDefault();
        let delta = 0, isTrackpad = false;
        if (e.deltaMode === WheelEvent.DOM_DELTA_PIXEL) {
          isTrackpad = true;
          delta = e.deltaX;
          if (Math.abs(delta) < 0.01 && e.shiftKey) delta = e.deltaY;
          if (Math.abs(delta) < 0.01) { delta = e.deltaY; isTrackpad = false; }
        } else {
          delta = e.deltaX;
          if (Math.abs(delta) < 0.01 && e.shiftKey) delta = e.deltaY;
          if (Math.abs(delta) < 0.01) delta = e.deltaY;
        }
        const factor = isTrackpad ? CFG.scrollFactor : CFG.fallbackMouseFactor;
        const addition = Math.sign(delta) * Math.min(Math.abs(delta) * factor, 0.003);
        spinVelocity += addition;
        spinVelocity = Math.max(-CFG.maxSpinVelocity, Math.min(CFG.maxSpinVelocity, spinVelocity));
        lastScrollTime = performance.now();
        consecutiveStillFrames = 0;
        if (faceSpringActive) faceSpringActive = false;
        if (faceSpringTimer) { clearTimeout(faceSpringTimer); faceSpringTimer = null; }
      }

      function handleTouchStart(e) {
        if (!enabled || typeof isAnimating === 'undefined' || isAnimating || REDUCED_MOTION || e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchPrevX = touchStartX;
        touchStartTime = performance.now();
        touchActive = true;
        e.preventDefault();
      }

      function handleTouchMove(e) {
        if (!touchActive) return;
        e.preventDefault();
        const x = e.touches[0].clientX;
        const dx = x - touchPrevX;
        touchPrevX = x;
        if (Math.abs(dx) > 0.5) {
          spinVelocity += dx * 0.0001;
          spinVelocity = Math.max(-CFG.maxSpinVelocity, Math.min(CFG.maxSpinVelocity, spinVelocity));
          lastScrollTime = performance.now();
          consecutiveStillFrames = 0;
          if (faceSpringActive) faceSpringActive = false;
          if (faceSpringTimer) { clearTimeout(faceSpringTimer); faceSpringTimer = null; }
        }
      }

      function handleTouchEnd(e) {
        if (!touchActive) return;
        touchActive = false;
        const totalDx = (e.changedTouches[0]?.clientX || touchPrevX) - touchStartX;
        const totalDy = (e.changedTouches[0]?.clientY || touchStartY) - touchStartY;
        const duration = performance.now() - touchStartTime;
        const distance = Math.sqrt(totalDx * totalDx + totalDy * totalDy);
        if (distance < CFG.tapMaxMovement && duration < CFG.tapMaxDuration) return;
        e.preventDefault();
      }

      function update(dt) {
        if (REDUCED_MOTION) {
          globeAngleY += CFG.reducedGlobeSpeedY * dt * 60;
          return;
        }
        spinVelocity *= Math.pow(CFG.damping, dt * 60);
        if (Math.abs(spinVelocity) < CFG.velocityDeadZone) {
          spinVelocity = 0;
          consecutiveStillFrames++;
        } else {
          consecutiveStillFrames = 0;
        }
        if (state === 'landing') {
          globeAngleY += (CFG.globeSpeedY + spinVelocity) * dt * 60;
        }
        if (state === 'agent') {
          faceOffsetY += spinVelocity * dt * 60;
          faceOffsetY = Math.max(-1.0, Math.min(1.0, faceOffsetY));
          const scrolledRecently = (performance.now() - lastScrollTime) < CFG.faceIdleDelay;
          const velocityDead = spinVelocity === 0 && consecutiveStillFrames >= 3;
          if (!scrolledRecently && velocityDead && !faceSpringActive) faceSpringActive = true;
          if (faceSpringActive) {
            const absOffset = Math.abs(faceOffsetY);
            const springRate = absOffset < CFG.faceZoneThreshold ? CFG.faceSpringFast : CFG.faceSpringSlow;
            faceOffsetY += (0 - faceOffsetY) * springRate * dt * 60;
            if (absOffset < CFG.faceSnapThreshold) {
              faceOffsetY = 0;
              faceSpringActive = false;
              consecutiveStillFrames = 0;
            }
          }
        }
      }

      function isFaceAtRest() {
        return Math.abs(faceOffsetY) < CFG.faceRestThreshold && !faceSpringActive;
      }

      function isFaceScrolling() {
        return Math.abs(spinVelocity) > CFG.velocityDeadZone || faceSpringActive;
      }

      function reset() {
        spinVelocity = 0;
        globeAngleY = 0;
        faceOffsetY = 0;
        faceSpringActive = false;
        consecutiveStillFrames = 0;
        lastScrollTime = 0;
        if (faceSpringTimer) { clearTimeout(faceSpringTimer); faceSpringTimer = null; }
      }

      return {
        get spinVelocity() { return spinVelocity; },
        get globeAngleY() { return globeAngleY; },
        get faceOffsetY() { return faceOffsetY; },
        get faceSpringActive() { return faceSpringActive; },
        get enabled() { return enabled; },
        CFG,
        handleWheel, handleTouchStart, handleTouchMove, handleTouchEnd,
        update, isFaceAtRest, isFaceScrolling, reset,
      };
    })();

    // --- Wave 1: Deformation weights (precomputed) ---
    let jawWeights = null;
    let jawCurveWeight = null;
    let noseBaseWeight = null;
    let cheekWeight = null;

    function computeJawWeights(lms) {
      const hingeA = lms[234], hingeB = lms[454];
      const chin = lms[152];
      const dx = hingeB.x - hingeA.x, dy = hingeB.y - hingeA.y, dz = hingeB.z - hingeA.z;
      const len2 = dx*dx + dy*dy + dz*dz;
      const maxDist = Math.sqrt(
        (() => { const c = chin; const t = ((c.x-hingeA.x)*dx + (c.y-hingeA.y)*dy + (c.z-hingeA.z)*dz) / len2; const px = hingeA.x + t*dx, py = hingeA.y + t*dy, pz = hingeA.z + t*dz; return (c.x-px)**2 + (c.y-py)**2 + (c.z-pz)**2; })()
      );
      const jw = new Float32Array(NUM);
      const jcw = new Float32Array(NUM);
      const nbw = new Float32Array(NUM);
      const cw = new Float32Array(NUM);
      const upperLipY = lms[13].y;
      const noseBaseSet = new Set([1,2,98,327]);
      const cheekSet = new Set([36,93,132,137,205,206,216,227,234,331,366,371,425,427,430,436,450,454,458]);
      const jawCurveIndices = [0,17,37,39,40,61,91,146,181,185,267,269,270,291,314,321,375,405,409];
      for (let i = 0; i < NUM; i++) {
        const p = lms[i];
        if (p.y > upperLipY) { jw[i] = 0; continue; }
        const t = ((p.x-hingeA.x)*dx + (p.y-hingeA.y)*dy + (p.z-hingeA.z)*dz) / len2;
        const px = hingeA.x + t*dx, py = hingeA.y + t*dy, pz = hingeA.z + t*dz;
        const d = Math.sqrt((p.x-px)**2 + (p.y-py)**2 + (p.z-pz)**2);
        const r = d / maxDist;
        jw[i] = Math.max(0, 1 - Math.cos(r * Math.PI) / 2 - 0.5);
        jcw[i] = jawCurveIndices.includes(i) ? jw[i] : 0;
        nbw[i] = noseBaseSet.has(i) ? 1 : 0;
        cw[i] = cheekSet.has(i) ? jw[i] * 0.5 : 0;
      }
      jawWeights = jw; jawCurveWeight = jcw; noseBaseWeight = nbw; cheekWeight = cw;
    }

    function normalizeVisemes(profile) {
      if (!profile || !profile.visemes) return;
      for (const key of ['A','E','O','U','F']) {
        const v = profile.visemes[key];
        if (v) v.jawOpen = Math.min(v.jawOpen, v.neutral?.jawOpen + 0.40 || 0.40);
      }
      if (profile.visemes.I) profile.visemes.I.jawOpen = profile.neutral.blendshapes?.jawOpen || 0;
      if (profile.visemes.M) profile.visemes.M.jawOpen = Math.min(profile.visemes.M.jawOpen, (profile.neutral.blendshapes?.jawOpen || 0) + 0.05);
    }

    // --- Scene ---
    const canvas = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.1, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    // --- IBL ---
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envTex = pmrem.fromScene(new RoomEnvironment()).texture;
    scene.environment = envTex;

    // --- Three-point lighting ---
    scene.add(new THREE.AmbientLight(0x1a1a2e, 0.6));
    const keyLight = new THREE.DirectionalLight(0xc8e8ff, 1.2);
    keyLight.position.set(1, 2, 3);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x334466, 0.5);
    fillLight.position.set(-2, 0.5, 1);
    scene.add(fillLight);

    // --- Fibonacci sphere ---
    function fibonacciSphere(n) {
      const pts = []; const phi = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < n; i++) {
        const y = 1 - (i / (n - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = phi * i;
        pts.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r });
      }
      return pts;
    }
    const icoPoints = fibonacciSphere(NUM);

    const positions = new Float32Array(NUM * 3);
    for (let i = 0; i < NUM; i++) {
      positions[i * 3] = icoPoints[i].x;
      positions[i * 3 + 1] = icoPoints[i].y;
      positions[i * 3 + 2] = icoPoints[i].z;
    }
    const icoGeo = new THREE.BufferGeometry();
    icoGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // Point cloud
    const icoDotMat = new THREE.PointsMaterial({
      size: 0.035, color: 0x00d4ff,
      blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.55,
    });
    const icoCloud = new THREE.Points(icoGeo, icoDotMat);

    // Neighbor wireframe
    function nearestNeighborEdges(lms, k) {
      const edges = []; const used = new Set();
      for (let i = 0; i < lms.length; i++) {
        const ds = [];
        for (let j = 0; j < lms.length; j++) {
          if (i === j) continue;
          const dx = lms[i].x - lms[j].x, dy = lms[i].y - lms[j].y, dz = lms[i].z - lms[j].z;
          ds.push({ idx: j, d: dx * dx + dy * dy + dz * dz });
        }
        ds.sort((a, b) => a.d - b.d);
        for (let kk = 0; kk < Math.min(k, ds.length); kk++) {
          const key = Math.min(i, ds[kk].idx) + '-' + Math.max(i, ds[kk].idx);
          if (!used.has(key)) { used.add(key); edges.push([i, ds[kk].idx]); }
        }
      }
      return edges;
    }
    const nnEdges = nearestNeighborEdges(icoPoints, 6);
    nnIndices = [];
    for (const [a, b] of nnEdges) nnIndices.push(a, b);

    const icoGroup = new THREE.Group();

    // Edge wireframe — shares icoGeo's position buffer so morph drives both
    const icoEdgeGeo = new THREE.BufferGeometry();
    icoEdgeGeo.setAttribute('position', icoGeo.attributes.position);
    icoEdgeGeo.setIndex(nnIndices);
    icoEdgeGeo.setDrawRange(0, nnIndices.length);
    const icoEdgeMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.28 });
    const icoEdges = new THREE.LineSegments(icoEdgeGeo, icoEdgeMat);
    icoGroup.add(icoEdges);

    const icoEdgeGlowMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.10, depthTest: false, depthWrite: false });
    const icoEdgeGlowGeom = new THREE.BufferGeometry();
    icoEdgeGlowGeom.setAttribute('position', icoGeo.attributes.position);
    icoEdgeGlowGeom.setIndex([...nnIndices]);
    icoEdgeGlowGeom.setDrawRange(0, nnIndices.length);
    const icoEdgeGlow = new THREE.LineSegments(icoEdgeGlowGeom, icoEdgeGlowMat);
    icoGroup.add(icoEdgeGlow);

    function setWireframeEdgeIndices(indices) {
      icoEdgeGeo.setIndex(indices);
      icoEdgeGeo.setDrawRange(0, indices.length);
      icoEdgeGlow.geometry.setIndex(indices);
      icoEdgeGlow.geometry.setDrawRange(0, indices.length);
    }

    icoGroup.add(icoCloud);
    scene.add(icoGroup);

    // --- Face wireframe (pre-built, opacity 0) ---
    function contourEdges(contours) {
      const e = [];
      for (const c of Object.values(contours)) {
        for (let i = 0; i < c.length - 1; i++) e.push([c[i], c[i + 1]]);
        if (c.length > 2) e.push([c[c.length - 1], c[0]]);
      }
      return e;
    }

    let faceContourLines = null;
    let faceContourGlow = null;
    let faceMouthCavity = null;
    let faceKeyNodes = [];
    let faceIrisNodes = [];

    function buildFace(lms) {
      const fp = new Float32Array(NUM * 3);
      for (let i = 0; i < NUM; i++) {
        fp[i * 3] = lms[i].x; fp[i * 3 + 1] = lms[i].y; fp[i * 3 + 2] = lms[i].z;
      }
      const fGeo = new THREE.BufferGeometry();
      fGeo.setAttribute('position', new THREE.BufferAttribute(fp, 3));

      const edgeList = contourEdges(CONTOURS);
      const idx = [];
      for (const [a, b] of edgeList) idx.push(a, b);
      fGeo.setIndex(idx);
      fGeo.setDrawRange(0, idx.length);

      const cMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0, depthTest: false });
      faceContourLines = new THREE.LineSegments(fGeo, cMat);
      faceContourLines.renderOrder = 1;
      icoGroup.add(faceContourLines);

      const gMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
      faceContourGlow = new THREE.LineSegments(fGeo.clone(), gMat);
      icoGroup.add(faceContourGlow);

      // Mouth cavity
      const cavityTris = []; const mIdx = [...MOUTH_INNER, ...MOUTH_OUTER];
      for (let i = 0; i < mIdx.length; i++) {
        for (let j = i + 1; j < mIdx.length; j++) {
          for (let k = j + 1; k < mIdx.length; k++) {
            cavityTris.push(mIdx[i], mIdx[j], mIdx[k]);
          }
        }
      }
      const cGeo = new THREE.BufferGeometry();
      const cPos = new Float32Array(NUM * 3);
      cPos.set(fp);
      cGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
      cGeo.setIndex(cavityTris.slice(0, 3000));
      cGeo.computeVertexNormals();
      const cMatMouth = new THREE.MeshBasicMaterial({ color: 0x000a1a, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
      faceMouthCavity = new THREE.Mesh(cGeo, cMatMouth);
      faceMouthCavity.renderOrder = 0;
      icoGroup.add(faceMouthCavity);

      // Key nodes (subtle landmark markers)
      const knGeo = new THREE.SphereGeometry(0.008, 6, 6);
      const knMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0 });
      for (const idx of KEY_NODE_INDICES) {
        if (idx >= NUM) continue;
        const dot = new THREE.Mesh(knGeo, knMat);
        dot.position.set(lms[idx].x, lms[idx].y, lms[idx].z);
        dot.userData.idx = idx;
        icoGroup.add(dot);
        faceKeyNodes.push(dot);
      }

      // Iris nodes
      const irGeo = new THREE.SphereGeometry(0.028, 12, 12);
      const irMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 });
      for (const idx of [468, 473]) {
        if (idx >= NUM) continue;
        const dot = new THREE.Mesh(irGeo, irMat);
        dot.position.set(lms[idx].x, lms[idx].y, lms[idx].z);
        dot.userData.idx = idx;
        icoGroup.add(dot);
        faceIrisNodes.push(dot);

        const glowGeo = new THREE.SphereGeometry(0.045, 12, 12);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.copy(dot.position);
        glow.userData.idx = idx;
        icoGroup.add(glow);
        faceIrisNodes.push(glow);
      }

      return fp;
    }

    const facePositions = new Float32Array(NUM * 3);

    function updateFaceGeometry(src) {
      if (faceContourLines) {
        const a = faceContourLines.geometry.attributes.position.array;
        for (let i = 0; i < NUM * 3; i++) a[i] = src[i];
        faceContourLines.geometry.attributes.position.needsUpdate = true;
      }
      if (faceContourGlow) {
        const a = faceContourGlow.geometry.attributes.position.array;
        for (let i = 0; i < NUM * 3; i++) a[i] = src[i];
        faceContourGlow.geometry.attributes.position.needsUpdate = true;
      }
      if (faceMouthCavity) {
        const a = faceMouthCavity.geometry.attributes.position.array;
        const innerLip = [78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95];
        const n = innerLip.length;
        for (let i = 0; i < n; i++) {
          const idx = innerLip[i];
          a[(i+1)*3]     = src[idx*3];
          a[(i+1)*3 + 1] = src[idx*3 + 1];
          a[(i+1)*3 + 2] = src[idx*3 + 2];
        }
        let cx = 0, cy = 0, cz = 0;
        for (let i = 0; i < n; i++) { cx += a[(i+1)*3]; cy += a[(i+1)*3 + 1]; cz += a[(i+1)*3 + 2]; }
        a[0] = cx/n; a[1] = cy/n; a[2] = cz/n;
        faceMouthCavity.geometry.attributes.position.needsUpdate = true;
        faceMouthCavity.geometry.computeVertexNormals();
      }
      for (const dot of [...faceKeyNodes, ...faceIrisNodes]) {
        const idx = dot.userData.idx;
        if (idx !== undefined && idx < NUM) {
          dot.position.set(src[idx * 3], src[idx * 3 + 1], src[idx * 3 + 2]);
        }
      }
    }

    // --- Viseme data structures ---
    const VOWEL_VISEMES = { a: 'A', e: 'E', i: 'I', o: 'O', u: 'U' };
    const CONSONANT_VISEMES = {
      b:'M', p:'M', m:'M', f:'F', v:'F', w:'U',
      t:'E', d:'E', s:'E', z:'E', n:'E', l:'E', r:'E', th:'E', dh:'E',
      k:'A', g:'A', ng:'A', h:'A', y:'I', ch:'I', sh:'I', zh:'I', j:'I',
    };
    const FUNCTION_WORDS = new Set(['the','a','an','in','on','at','to','for','of','and','or','but',
      'is','are','was','were','be','been','have','has','had','do','does','did',
      'will','would','can','could','shall','should','may','might','not','no',
      'it','its','this','that','these','those','i','you','he','she','we','they',
      'my','your','his','her','our','their','me','him','us','them']);
    const VOWEL_SET = new Set(['a','e','i','o','u']);

    // --- Load scan ---
    async function loadScan() {
      const r = await fetch('/data/robota_scan.json');
      scanData = await r.json();
      const lm = scanData.neutral.landmarksNormalized || scanData.neutral.landmarks;
      faceLMs = lm.map(p => ({
        x: p.x * FACE_SCALE, y: -p.y * FACE_SCALE_Y, z: (p.z || 0) * FACE_SCALE_Z,
      }));
      baseLMs = faceLMs.map(p => ({ ...p }));
      workingBuffer = faceLMs.map(p => ({ ...p }));

      // Compute triangulated NN edges for face (used as wireframe during face mode)
      const faceNNEdges = nearestNeighborEdges(faceLMs, 6);
      faceNNIndices = [];
      for (const [a, b] of faceNNEdges) faceNNIndices.push(a, b);

      // Build face wireframe
      const fp = buildFace(faceLMs);
      facePositions.set(fp);

      // Expose
      computeJawWeights(faceLMs);
      normalizeVisemes(scanData);

      window.__scene = {
        state, icoGeo, icoCloud, icoDotMat, icoGroup, icoEdges, icoEdgeMat,
        faceContourLines, faceContourGlow, faceMouthCavity,
        faceKeyNodes, faceIrisNodes,
        faceLMs, baseLMs, workingBuffer, triggerTransform, resetToLanding, scene, camera, renderer,
        icoPoints, positions, NUM, isAnimating: false,
        faceLandmarks3D: faceLMs, seedPositionsArr: positions,
        jawWeights, jawCurveWeight, noseBaseWeight, cheekWeight,
        scanData, behavior: null,
        faceNNIndices,
      };
    }

    await loadScan();

    // --- Hit sphere ---
    const hitGeo = new THREE.SphereGeometry(1.0, 16, 16);
    const hitMat = new THREE.MeshBasicMaterial({ visible: false });
    const hitSphere = new THREE.Mesh(hitGeo, hitMat);
    scene.add(hitSphere);

    // --- Transform ---
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    let isAnimating = false;

    function triggerTransform() {
      if (state !== 'landing' || isAnimating) return;
      isAnimating = true;
      state = 'transforming';
      if (window.__scene) window.__scene.state = state;

      gsap.to('#overlay', { opacity: 0, duration: 0.5 });


      // Reset accumulated rotation so face aligns with world
      icoGroup.rotation.set(0, 0, 0);
      ScrollController.reset();

      const targets = faceLMs;
      let indicesSwapped = false;
      const morphObj = { progress: 0 };
      gsap.to(morphObj, {
        progress: 1, duration: 2.0, ease: 'power2.inOut',
        onUpdate: () => {
          const t = easeInOutCubic(morphObj.progress);
          for (let i = 0; i < NUM; i++) {
            const sx = icoPoints[i].x, sy = icoPoints[i].y, sz = icoPoints[i].z;
            const fx = targets[i].x, fy = targets[i].y, fz = targets[i].z;
            positions[i * 3] = sx + (fx - sx) * t;
            positions[i * 3 + 1] = sy + (fy - sy) * t;
            positions[i * 3 + 2] = sz + (fz - sz) * t;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          updateFaceGeometry(positions);

          // Crossfade: sphere NN edges fade out → switch indices → face NN edges fade in
          if (t < 0.5) {
            const p = t * 2;
            icoEdgeMat.opacity = 0.28 * (1 - p);
            icoEdgeGlowMat.opacity = 0.10 * (1 - p);
          } else {
            if (faceNNIndices && !indicesSwapped) {
              setWireframeEdgeIndices(faceNNIndices);
              indicesSwapped = true;
            }
            const p = (t - 0.5) * 2;
            icoEdgeMat.opacity = 0.35 * p;
            icoEdgeGlowMat.opacity = 0.12 * p;
          }
          faceContourLines.material.opacity = 0.75 * t;
          faceContourGlow.material.opacity = 0.18 * t;
          faceMouthCavity.material.opacity = 0.55 * t;
          faceKeyNodes.forEach(n => { n.material.opacity = 0.25 * t; });
          faceIrisNodes.forEach(n => {
            n.material.opacity = (n.geometry.parameters?.radius > 0.03 ? 0.15 : 1) * t;
          });
        },
        onComplete: () => {
          for (let i = 0; i < NUM; i++) {
            positions[i * 3] = targets[i].x;
            positions[i * 3 + 1] = targets[i].y;
            positions[i * 3 + 2] = targets[i].z;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          updateFaceGeometry(positions);
          if (faceNNIndices) setWireframeEdgeIndices(faceNNIndices);
          icoEdgeMat.opacity = 0.35;
          icoEdgeGlowMat.opacity = 0.12;
        }
      });

      gsap.to(camera.position, { z: 4.5, duration: 2.0, delay: 0.3, ease: 'power2.inOut' });
      gsap.to('#agent-ui', { opacity: 1, duration: 0.6, delay: 2.2, onStart: () => { document.getElementById('agent-ui').classList.add('visible'); document.getElementById('shapeRow').classList.add('visible'); } });
      gsap.to('nav', { opacity: 1, duration: 0.6, delay: 2.0, onStart: () => document.querySelector('nav').classList.add('visible') });

      gsap.to({}, { delay: 2.5, onComplete: () => { state = 'agent'; isAnimating = false; if (window.__scene) window.__scene.state = state; startBehavior(); } });
    }

    // --- Reset to landing ---
    function resetToLanding() {
      if (state === 'landing' || isAnimating) return;
      isAnimating = true;
      ScrollController.reset();
      state = 'resetting';
      if (window.__scene) window.__scene.state = state;

      // Kill any active GSAP tweens on these objects
      gsap.killTweensOf('#overlay');
      gsap.killTweensOf('#agent-ui');
      gsap.killTweensOf('nav');
      gsap.killTweensOf(icoDotMat);
      gsap.killTweensOf(camera.position);
      gsap.killTweensOf(icoEdgeMat);
      gsap.killTweensOf(faceContourLines.material);
      gsap.killTweensOf(faceContourGlow.material);
      gsap.killTweensOf(faceMouthCavity.material);
      faceKeyNodes.forEach(n => gsap.killTweensOf(n.material));

      faceIrisNodes.forEach(n => gsap.killTweensOf(n.material));

      const startPos = new Float32Array(positions);

      const morphObj = { progress: 0 };
      gsap.to(morphObj, {
        progress: 1, duration: 1.5, ease: 'power2.inOut',
        onUpdate: () => {
          const t = easeInOutCubic(morphObj.progress);
          for (let i = 0; i < NUM; i++) {
            const sx = startPos[i * 3], sy = startPos[i * 3 + 1], sz = startPos[i * 3 + 2];
            const fx = icoPoints[i].x, fy = icoPoints[i].y, fz = icoPoints[i].z;
            positions[i * 3]     = sx + (fx - sx) * t;
            positions[i * 3 + 1] = sy + (fy - sy) * t;
            positions[i * 3 + 2] = sz + (fz - sz) * t;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          updateFaceGeometry(positions);

          // Reverse crossfade: face NN edges fade out → switch to sphere NN edges → fade in
          if (t < 0.5) {
            const p = t * 2;
            icoEdgeMat.opacity = 0.35 * (1 - p);
            icoEdgeGlowMat.opacity = 0.12 * (1 - p);
          } else {
            if (nnIndices) setWireframeEdgeIndices(nnIndices);
            const p = (t - 0.5) * 2;
            icoEdgeMat.opacity = 0.28 * p;
            icoEdgeGlowMat.opacity = 0.10 * p;
          }
          faceContourLines.material.opacity = 0.75 * (1 - t);
          faceContourGlow.material.opacity = 0.18 * (1 - t);
          faceMouthCavity.material.opacity = 0.55 * (1 - t);
          faceKeyNodes.forEach(n => { n.material.opacity = 0.25 * (1 - t); });
          faceIrisNodes.forEach(n => {
            n.material.opacity = (n.geometry.parameters?.radius > 0.03 ? 0.15 : 1) * (1 - t);
          });
        },
        onComplete: () => {
          for (let i = 0; i < NUM; i++) {
            positions[i * 3]     = icoPoints[i].x;
            positions[i * 3 + 1] = icoPoints[i].y;
            positions[i * 3 + 2] = icoPoints[i].z;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          updateFaceGeometry(positions);
          if (nnIndices) setWireframeEdgeIndices(nnIndices);
          icoEdgeMat.opacity = 0.28;
          icoEdgeGlowMat.opacity = 0.10;
        }
      });

      // Restore camera
      gsap.to(camera.position, { z: 6, duration: 1.2, ease: 'power2.inOut' });

      // Restore overlay
      gsap.to('#overlay', { opacity: 1, duration: 0.4, delay: 0.3 });

      // Hide agent UI and nav
      gsap.to('#agent-ui', { opacity: 0, duration: 0.3, onComplete: () => { document.getElementById('agent-ui').classList.remove('visible'); document.getElementById('shapeRow').classList.remove('visible'); } });
      gsap.to('nav', { opacity: 0, duration: 0.3, onComplete: () => document.querySelector('nav').classList.remove('visible') });

      // Reset nav active states
      document.getElementById('navHome').classList.add('active');
      document.getElementById('navAgent').classList.remove('active');

      // Reset shape to face
      shapeTargets = null;
      shapeTargetEdgeIndices = null;
      currentShape = 'face';
      document.querySelectorAll('.shape-pill').forEach(p => p.classList.toggle('active', p.dataset.shape === 'face'));

      gsap.to({}, {
        delay: 1.8,
        onComplete: () => {
          state = 'landing'; isAnimating = false;
          if (window.__scene) window.__scene.state = state;
        }
      });
    }

    // --- Nav handlers ---
    document.getElementById('navHome').addEventListener('click', (e) => {
      e.preventDefault();
      resetToLanding();
    });

    document.getElementById('navBlogs').addEventListener('click', (e) => {
      if (state === 'landing') return;
      e.preventDefault();
      window.location.href = '/blogs';
    });

    // --- Keyboard ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { resetToLanding(); }
    });

    // --- Shape morphing engine ---
    const SHAPE_NAMES = ['face', 'sphere', 'cube', 'cylinder', 'pyramid', 'torus'];

    async function loadShapeGLB(name) {
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(`/data/shapes/${name}.glb`);
      const mesh = gltf.scene.children[0];
      const geo = mesh.geometry;
      const rawVerts = geo.attributes.position.array;
      const rawCount = rawVerts.length / 3;

      // Sample shape surface at each Fibonacci direction → 478 morph targets
      const targets = new Array(NUM);
      for (let i = 0; i < NUM; i++) {
        let bestD = Infinity, bestJ = 0;
        const ip = icoPoints[i];
        for (let j = 0; j < rawCount; j++) {
          const dx = ip.x - rawVerts[j * 3];
          const dy = ip.y - rawVerts[j * 3 + 1];
          const dz = ip.z - rawVerts[j * 3 + 2];
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 < bestD) { bestD = d2; bestJ = j; }
        }
        targets[i] = { x: rawVerts[bestJ*3], y: rawVerts[bestJ*3+1], z: rawVerts[bestJ*3+2] };
      }
      shapeTargets = targets;

      // Compute nearest-neighbor edges on the sampled 478-point cloud
      const shapeEdges = nearestNeighborEdges(targets, 6);
      shapeTargetEdgeIndices = [];
      for (const [a, b] of shapeEdges) shapeTargetEdgeIndices.push(a, b);
      return true;
    }

    function getTargetsForShape(name) {
      if (name === 'face') return faceLMs;
      if (name === 'sphere') return icoPoints;
      return shapeTargets;
    }

    async function switchShape(name) {
      if (isAnimating || name === currentShape) return;
      const prevShape = currentShape;
      currentShape = name;

      // Update pill active states
      document.querySelectorAll('.shape-pill').forEach(p => p.classList.toggle('active', p.dataset.shape === name));

      // Load GLB for solid shapes (not sphere which uses icoPoints, not face which uses faceLMs)
      if (name !== 'face' && name !== 'sphere' && name !== prevShape) {
        try { if (!await loadShapeGLB(name)) { currentShape = prevShape; return; } } catch (e) { console.warn('Shape load failed:', e); currentShape = prevShape; return; }
      }

      const targets = getTargetsForShape(name);
      if (!targets) { currentShape = prevShape; return; }

      // If landing state, morph from ico to shape/face
      if (state === 'landing') {
        if (name === 'face') { triggerTransform(); return; }
        if (name === 'sphere') return; // Already a sphere
        // Morph from ico to solid shape
        gsap.to('#overlay', { opacity: 0, duration: 0.5 });
        morphToTarget(targets, name, 2.0);
        gsap.to(camera.position, { z: 4.5, duration: 2.0, delay: 0.3, ease: 'power2.inOut' });
        gsap.to('#agent-ui', { opacity: 1, duration: 0.6, delay: 2.2, onStart: () => { document.getElementById('agent-ui').classList.add('visible'); document.getElementById('shapeRow').classList.add('visible'); } });
        gsap.to('nav', { opacity: 1, duration: 0.6, delay: 2.0, onStart: () => document.querySelector('nav').classList.add('visible') });
        return;
      }

      // In agent/transforming state, morph between current and target
      morphToTarget(targets, name, 1.5);
    }

    function morphToTarget(targets, shapeName, duration) {
      isAnimating = true;
      const startPos = new Float32Array(positions);
      const isFace = shapeName === 'face';
      const isSphere = shapeName === 'sphere';
      const isShape = !isFace && !isSphere;

      // Determine target edge indices per mode
      const targetEdgeIndices = isFace ? faceNNIndices : (isSphere ? nnIndices : shapeTargetEdgeIndices);

      // Snapshot current opacities
      const fcOp = faceContourLines ? faceContourLines.material.opacity : 0;
      const fgOp = faceContourGlow ? faceContourGlow.material.opacity : 0;
      const fmOp = faceMouthCavity ? faceMouthCavity.material.opacity : 0;
      const knOps = faceKeyNodes.map(n => n.material.opacity);
      const irOps = faceIrisNodes.map(n => n.material.opacity);
      const ieOp = icoEdgeMat.opacity;
      const igOp = icoEdgeGlowMat.opacity;

      // Target opacities — unified wireframe-only scheme per PLAN.md
      const tFcOp = isFace ? 0.75 : 0;
      const tFgOp = isFace ? 0.18 : 0;
      const tFmOp = isFace ? 0.55 : 0;
      const tKnOp = isFace ? 0.25 : 0;
      const tIeOp = isFace ? 0.35 : (isSphere ? 0.28 : 0.22);
      const tIgOp = isFace ? 0.12 : (isSphere ? 0.10 : 0.08);

      let indicesSwapped = false;

      const morphObj = { progress: 0 };
      gsap.to(morphObj, {
        progress: 1, duration, ease: 'power2.inOut',
        onUpdate: () => {
          const t = easeInOutCubic(morphObj.progress);
          for (let i = 0; i < NUM; i++) {
            positions[i*3]     = startPos[i*3]     + (targets[i].x - startPos[i*3])     * t;
            positions[i*3 + 1] = startPos[i*3 + 1] + (targets[i].y - startPos[i*3 + 1]) * t;
            positions[i*3 + 2] = startPos[i*3 + 2] + (targets[i].z - startPos[i*3 + 2]) * t;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          if (isFace && t > 0) updateFaceGeometry(positions);

          // Swap edge indices at midpoint
          if (t >= 0.5 && !indicesSwapped && targetEdgeIndices) {
            setWireframeEdgeIndices(targetEdgeIndices);
            indicesSwapped = true;
          }

          // Crossfade face contour elements
          if (faceContourLines) faceContourLines.material.opacity = fcOp + (tFcOp - fcOp) * t;
          if (faceContourGlow) faceContourGlow.material.opacity = fgOp + (tFgOp - fgOp) * t;
          if (faceMouthCavity) faceMouthCavity.material.opacity = fmOp + (tFmOp - fmOp) * t;
          faceKeyNodes.forEach((n, i) => { n.material.opacity = knOps[i] + (tKnOp - knOps[i]) * t; });
          faceIrisNodes.forEach((n, i) => { const to = isFace ? (n.geometry.parameters?.radius > 0.03 ? 0.15 : 1) : 0; n.material.opacity = irOps[i] + (to - irOps[i]) * t; });

          // Crossfade unified edges
          icoEdgeMat.opacity = ieOp + (tIeOp - ieOp) * t;
          icoEdgeGlowMat.opacity = igOp + (tIgOp - igOp) * t;
        },
        onComplete: () => {
          for (let i = 0; i < NUM; i++) {
            positions[i*3]     = targets[i].x;
            positions[i*3+1]   = targets[i].y;
            positions[i*3+2]   = targets[i].z;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          if (isFace) updateFaceGeometry(positions);

          if (!indicesSwapped && targetEdgeIndices) setWireframeEdgeIndices(targetEdgeIndices);

          if (faceContourLines) faceContourLines.material.opacity = tFcOp;
          if (faceContourGlow) faceContourGlow.material.opacity = tFgOp;
          if (faceMouthCavity) faceMouthCavity.material.opacity = tFmOp;
          faceKeyNodes.forEach(n => { n.material.opacity = tKnOp; });
          faceIrisNodes.forEach(n => { n.material.opacity = 0; });
          icoEdgeMat.opacity = tIeOp;
          icoEdgeGlowMat.opacity = tIgOp;

          isAnimating = false;
          if (isShape && shapeName !== 'face') state = 'agent';
          if (window.__scene) window.__scene.state = state;
        }
      });
    }

    // --- Shape pill click handlers ---
    document.querySelectorAll('.shape-pill').forEach(pill => {
      pill.addEventListener('click', () => switchShape(pill.dataset.shape));
    });

    // --- FPS monitor + render loop ---
    const fpsEl = document.createElement('div');
    fpsEl.id = 'fps';
    fpsEl.style.cssText = 'position:fixed;bottom:8px;right:8px;z-index:99;color:rgba(0,212,255,0.3);font:12px monospace;pointer-events:none;';
    document.body.appendChild(fpsEl);
    let fpsFrames = 0, fpsTime = 0;
    let lastRAFTime = 0;

    function animate(time) {
      requestAnimationFrame(animate);
      fpsFrames++;
      if (time - fpsTime >= 1000) {
        fpsEl.textContent = fpsFrames + ' FPS';
        fpsFrames = 0; fpsTime = time;
      }
      const dt = Math.min((time - lastRAFTime) / 1000 || 0.016, 0.05);
      lastRAFTime = time;

      // --- Scroll-driven rotation ---
      ScrollController.update(dt);

      if (state === 'landing') {
        icoGroup.rotation.x += ScrollController.CFG.globeSpeedX;
        icoGroup.rotation.y = ScrollController.globeAngleY;
        icoGroup.rotation.z += ScrollController.CFG.globeSpeedZ;
      }

      // --- Agent mode animation ---
      if (state === 'agent' && window.__scene?.behavior && workingBuffer && baseLMs) {
        const isFaceMode = currentShape === 'face' || currentShape === 'sphere';
        const b = window.__scene.behavior.update(dt);
        const t = time / 1000;

        if (isFaceMode) {
          // Reset to base
          for (let i = 0; i < NUM; i++) {
            workingBuffer[i].x = baseLMs[i].x;
            workingBuffer[i].y = baseLMs[i].y;
            workingBuffer[i].z = baseLMs[i].z;
          }

          // Priority: VisemeEngine > EmotionState > idle behavior
          if (VisemeEngine.talking) {
          VisemeEngine.update(dt);
        } else if (EmotionState.target !== 'neutral' && EmotionState.blend < 1) {
          EmotionState.update(dt);
        } else {
          // Idle: blink + mouth micro-movements
          if (b.blink > 0.01) {
            for (const idx of UPPER_LIDS) if (workingBuffer[idx]) workingBuffer[idx].y -= b.blink * 0.08;
            for (const idx of LOWER_LIDS) if (workingBuffer[idx]) workingBuffer[idx].y += b.blink * 0.08 * 0.3;
          }
          if (b.mouth > 0.01) {
            for (const idx of MOUTH_INNER) if (workingBuffer[idx]) workingBuffer[idx].y -= b.mouth * 0.1;
            for (const idx of MOUTH_OUTER) if (workingBuffer[idx]) workingBuffer[idx].y -= b.mouth * 0.03;
          }
        }

        // Apply blink overlay on top of viseme/emotion
        if (b.blink > 0.01 && (VisemeEngine.talking || EmotionState.target !== 'neutral')) {
          for (const idx of UPPER_LIDS) if (workingBuffer[idx]) workingBuffer[idx].y -= b.blink * 0.08;
          for (const idx of LOWER_LIDS) if (workingBuffer[idx]) workingBuffer[idx].y += b.blink * 0.08 * 0.3;
        }

        // Iris position updates (F12)
        const iris = computeIrisPositions(b.gazeX, b.gazeY);
        if (workingBuffer[468]) { workingBuffer[468].x = iris.left.x; workingBuffer[468].y = iris.left.y; workingBuffer[468].z = iris.left.z; }
        if (workingBuffer[473]) { workingBuffer[473].x = iris.right.x; workingBuffer[473].y = iris.right.y; workingBuffer[473].z = iris.right.z; }

        for (let i = 0; i < NUM; i++) {
          positions[i * 3] = workingBuffer[i].x;
          positions[i * 3 + 1] = workingBuffer[i].y;
          positions[i * 3 + 2] = workingBuffer[i].z;
        }
        icoGeo.attributes.position.needsUpdate = true;
        icoEdgeGeo.attributes.position.needsUpdate = true;
        icoEdgeGlow.geometry.attributes.position.needsUpdate = true;
        updateFaceGeometry(positions);

        // --- Contour glow pulse (F5) ---
        if (faceContourGlow) {
          faceContourGlow.material.opacity = 0.18 + Math.sin(t * 2.5) * 0.04;
        }
        } // end isFaceMode

        // --- Head group animation (F11/F15) — scroll-aware ---
        const scrollY = ScrollController.faceOffsetY;
        const scrolling = ScrollController.isFaceScrolling();
        const atRest = ScrollController.isFaceAtRest();

        const headMotion = HeadMotion.update(dt);
        if (headMotion && icoGroup) {
          const headYaw = headMotion.yaw * 0.5;
          icoGroup.rotation.y = scrollY + headYaw;
          icoGroup.rotation.x += (headMotion.pitch * 0.3 - icoGroup.rotation.x) * Math.min(1, dt * 2);
          icoGroup.rotation.z += (headMotion.roll * 0.3 - icoGroup.rotation.z) * Math.min(1, dt * 2);
        } else if (icoGroup && state === 'agent') {
          if (atRest) {
            const swayAmp = 0.6;
            const sway = (Math.sin(t * 0.4) * 0.05 + Math.sin(t * 0.23) * 0.03) * swayAmp;
            icoGroup.rotation.y = sway;
            icoGroup.rotation.x += (Math.sin(t * 0.31) * 0.02 * swayAmp - icoGroup.rotation.x) * Math.min(1, dt * 2);
          } else if (scrolling) {
            icoGroup.rotation.y = scrollY;
            icoGroup.rotation.x += (0 - icoGroup.rotation.x) * Math.min(1, dt * 1.5);
          } else {
            icoGroup.rotation.y = scrollY;
            icoGroup.rotation.x += (0 - icoGroup.rotation.x) * Math.min(1, dt * 1.5);
          }
        }
        // Vertical breathing bob
        if (icoGroup) icoGroup.position.y = 0.01 * Math.sin(t * 1.3 + 0.6) * 0.6;
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // ═══ Scroll & Touch Listeners ═══
    window.addEventListener('wheel', (e) => {
      if (ScrollController.enabled && !isAnimating && !REDUCED_MOTION) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        e.preventDefault();
        ScrollController.handleWheel(e);
      }
    }, { passive: false });

    window.addEventListener('touchstart', (e) => {
      if (ScrollController.enabled && !isAnimating && !REDUCED_MOTION) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        ScrollController.handleTouchStart(e);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (ScrollController.enabled && !isAnimating && !REDUCED_MOTION) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        ScrollController.handleTouchMove(e);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (ScrollController.enabled && !isAnimating && !REDUCED_MOTION) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        ScrollController.handleTouchEnd(e);
      }
    }, { passive: false });

    window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', (e) => {
      if (e.matches) {
        ScrollController.reset();
      }
    });

    // --- Raycasting ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if (state !== 'landing') return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(hitSphere);
      if (hits.length > 0) triggerTransform();
    });

    window.addEventListener('mousemove', (e) => {
      if (state !== 'landing') return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(hitSphere);
      document.body.style.cursor = hits.length > 0 ? 'pointer' : 'default';
    });

    // --- Autonomous behavior ---
    let behavior = null;

    function startBehavior() {
      const blinkPeriod = 2.5 + Math.random() * 3;
      let blinkTimer = Math.random() * blinkPeriod;
      let blinkPhase = 0;
      let isBlinking = false;
      let gazeX = 0, gazeY = 0, gazeTargetX = 0, gazeTargetY = 0, gazeTimer = 0;
      let mouthOpen = 0, mouthTarget = 0, mouthTimer = 0;
      let hasBlinked = false;

      window.__scene.behavior = {
        update(dt) {
          blinkTimer -= dt;
          if (isBlinking) {
            blinkPhase += dt / 0.15;
            if (blinkPhase >= 1) { isBlinking = false; blinkPhase = 0; blinkTimer = blinkPeriod * (0.5 + Math.random()); }
            if (blinkPhase > 0.4 && blinkPhase < 0.6) hasBlinked = true;
          } else if (blinkTimer <= 0) {
            isBlinking = true; blinkPhase = 0;
          }
          const bf = isBlinking ? (blinkPhase < 0.45 ? blinkPhase / 0.45 : 1 - (blinkPhase - 0.45) / 0.55) : 0;

          gazeTimer -= dt;
          if (gazeTimer <= 0) {
            gazeTargetX = (Math.random() - 0.5) * 0.08;
            gazeTargetY = (Math.random() - 0.5) * 0.04;
            gazeTimer = 0.5 + Math.random() * 2;
          }
          gazeX += (gazeTargetX - gazeX) * dt * 4;
          gazeY += (gazeTargetY - gazeY) * dt * 4;

          mouthTimer -= dt;
          if (mouthTimer <= 0) {
            mouthTarget = Math.random() < 0.3 ? 0.03 + Math.random() * 0.05 : 0;
            mouthTimer = 0.3 + Math.random() * 1.5;
          }
          mouthOpen += (mouthTarget - mouthOpen) * dt * 8;

          return { blink: bf, gazeX, gazeY, mouth: mouthOpen, hasBlinked };
        }
      };

      window.__scene.behavior._hasBlinked = () => hasBlinked;
    }

    // --- Wave 2: _applyVisemeBlendshapesToLandmarks ---
    function applyVisemeBlendshapesToLandmarks(jawOpen, smile, pucker, funnel, close) {
      if (!workingBuffer || !baseLMs) return;
      for (let i = 0; i < NUM; i++) {
        workingBuffer[i].x = baseLMs[i].x;
        workingBuffer[i].y = baseLMs[i].y;
        workingBuffer[i].z = baseLMs[i].z;
      }
      if (jawOpen > 0.001 && jawWeights) {
        for (let i = 0; i < NUM; i++) {
          const w = jawWeights[i];
          if (w > 0) {
            workingBuffer[i].y += -0.45 * jawOpen * w;
          }
        }
        const upperLip = [0,17,37,39,40,61,91,146,181,185,267,269,270,291,314,321,375,405,409];
        for (const idx of upperLip) if (workingBuffer[idx]) workingBuffer[idx].y += 0.27 * jawOpen;
        for (const idx of MOUTH_OUTER) if (workingBuffer[idx]) workingBuffer[idx].y -= 0.18 * jawOpen;
        for (const idx of MOUTH_INNER) if (workingBuffer[idx]) workingBuffer[idx].y -= 0.16 * jawOpen;
        const jawCurve = [0,17,37,39,40,61,91,146,181,185,267,269,270,291,314,321,375,405,409];
        for (const idx of jawCurve) if (workingBuffer[idx]) workingBuffer[idx].y -= 0.15 * jawOpen;
        if (noseBaseWeight) { for (let i = 0; i < NUM; i++) { if (noseBaseWeight[i] > 0) workingBuffer[i].y -= 0.03 * jawOpen; } }
        if (cheekWeight) { for (let i = 0; i < NUM; i++) { if (cheekWeight[i] > 0) workingBuffer[i].z -= 0.05 * jawOpen; } }
      }
      if (smile > 0.001) {
        if (workingBuffer[61]) workingBuffer[61].x -= 0.12 * smile;
        if (workingBuffer[291]) workingBuffer[291].x += 0.12 * smile;
      }
      if (pucker > 0.01) {
        if (workingBuffer[61]) workingBuffer[61].x += 0.04 * pucker;
        if (workingBuffer[291]) workingBuffer[291].x -= 0.04 * pucker;
      }
      if (funnel > 0.01) {
        if (workingBuffer[61]) workingBuffer[61].x += 0.04 * funnel;
        if (workingBuffer[291]) workingBuffer[291].x -= 0.04 * funnel;
        if (workingBuffer[0]) workingBuffer[0].z -= 0.02 * funnel;
        if (workingBuffer[17]) workingBuffer[17].z -= 0.02 * funnel;
      }
      if (close > 0.01) {
        for (const idx of [61, 291, 0, 17]) {
          if (workingBuffer[idx]) workingBuffer[idx].y += 0.06 * close;
        }
      }
    }

    // --- Wave 2: VisemeEngine ---
    const VisemeEngine = {
      plan: [],
      planCursor: 0,
      elapsed: 0,
      talking: false,
      smoothedJaw: 0, smoothedSmile: 0, smoothedPucker: 0, smoothedFunnel: 0, smoothedClose: 0,
      smoothedIntensity: 0,

      _parseSyllables(word) {
        const groups = []; let cur = ''; let isVowel = false;
        for (const ch of word.toLowerCase()) {
          const v = VOWEL_SET.has(ch);
          if (v !== isVowel && cur) { groups.push(cur); cur = ''; }
          isVowel = v; cur += ch;
        }
        if (cur) groups.push(cur);
        return groups;
      },

      _vowelViseme(syl) {
        for (const ch of syl) if (VOWEL_SET.has(ch)) return VOWEL_VISEMES[ch] || 'E';
        return 'E';
      },

      buildSyllablePlan(text) {
        this.plan = []; this.planCursor = 0; this.elapsed = 0;
        const words = text.split(/\s+/);
        let t = 0;
        for (let wi = 0; wi < words.length; wi++) {
          const word = words[wi].replace(/[^a-zA-Z0-9']/g, '');
          if (!word) continue;
          const isFunc = FUNCTION_WORDS.has(word.toLowerCase());
          const syls = this._parseSyllables(word);
          for (let si = 0; si < syls.length; si++) {
            const syl = syls[si];
            const viseme = this._vowelViseme(syl);
            const stress = isFunc ? 0.5 : (si === 0 ? 0.9 : 0.6);
            const dur = 0.18 + (syl.length > 2 ? 0.06 : 0) + (stress > 0.7 ? 0.04 : 0);
            this.plan.push({ viseme, startTime: t, duration: dur, stress });
            t += dur;
          }
          const punct = words[wi].match(/[,.!?;:]/) ? 0.3 : (wi < words.length - 1 ? 0.06 : 0);
          t += punct;
        }
        this.talking = this.plan.length > 0;
      },

      update(dt) {
        if (!this.talking || dt <= 0 || isNaN(dt)) return;

        // Blend live audio intensity into viseme — compensates for fixed-plan drift
        let audioBoost = 0;
        if (analyser) {
          const freqData = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(freqData);
          let sum = 0;
          for (let i = 0; i < freqData.length; i++) sum += freqData[i];
          const avg = sum / freqData.length / 255;
          audioBoost = avg > 0.02 ? avg * 1.5 : 0;
        }

        this.elapsed += dt;
        while (this.planCursor < this.plan.length && this.elapsed >= this.plan[this.planCursor].startTime + this.plan[this.planCursor].duration) {
          this.planCursor++;
        }
        if (this.planCursor >= this.plan.length) { this.talking = false; return; }

        const cur = this.plan[this.planCursor];
        const prog = Math.min(1, Math.max(0, (this.elapsed - cur.startTime) / cur.duration));
        const next = this.plan[this.planCursor + 1];
        const coartic = prog > 0.7 && next ? 0.3 : 0;

        let jaw = 0, smileVal = 0, pucker = 0, funnel = 0, close = 0;
        const v = cur.viseme;
        const intensity = cur.stress * (prog < 0.15 ? prog / 0.15 : (prog > 0.85 ? (1 - prog) / 0.15 : 1));
        if (v === 'A') { jaw = 0.4; }
        else if (v === 'E') { jaw = 0.25; smileVal = 0.15; }
        else if (v === 'I') { jaw = 0.1; smileVal = 0.2; }
        else if (v === 'O') { jaw = 0.3; funnel = 0.2; }
        else if (v === 'U') { jaw = 0.15; pucker = 0.25; }
        else if (v === 'F') { jaw = 0.05; close = 0.3; }
        else if (v === 'M') { jaw = 0.02; close = 0.4; }

        if (coartic > 0 && next) {
          const nv = next.viseme;
          const blend = coartic;
          if (nv === 'A') { jaw = jaw * (1-blend) + 0.4 * blend; }
          else if (nv === 'E') { jaw = jaw * (1-blend) + 0.25 * blend; smileVal = smileVal * (1-blend) + 0.15 * blend; }
          else if (nv === 'O') { jaw = jaw * (1-blend) + 0.3 * blend; funnel = funnel * (1-blend) + 0.2 * blend; }
        }

        jaw = Math.min(0.5, jaw * intensity + audioBoost * 0.3);
        smileVal = Math.min(0.5, smileVal * intensity);
        pucker = Math.min(0.4, pucker * intensity);
        funnel = Math.min(0.4, funnel * intensity);
        close = Math.min(0.5, close * intensity);

        const spd = Math.min(1, 1 - Math.exp(-12 * dt));
        this.smoothedJaw += (jaw - this.smoothedJaw) * spd;
        this.smoothedSmile += (smileVal - this.smoothedSmile) * spd;
        this.smoothedPucker += (pucker - this.smoothedPucker) * spd;
        this.smoothedFunnel += (funnel - this.smoothedFunnel) * spd;
        this.smoothedClose += (close - this.smoothedClose) * spd;
        this.smoothedIntensity += (intensity - this.smoothedIntensity) * Math.min(1, 1 - Math.exp(-15 * dt));

        applyVisemeBlendshapesToLandmarks(
          this.smoothedJaw * this.smoothedIntensity,
          this.smoothedSmile * this.smoothedIntensity,
          this.smoothedPucker * this.smoothedIntensity,
          this.smoothedFunnel * this.smoothedIntensity,
          this.smoothedClose * this.smoothedIntensity
        );
      },

      stop() { this.talking = false; this.plan = []; this.planCursor = 0; this.elapsed = 0; },
    };

    // --- Wave 2: EmotionState ---
    const EmotionState = {
      current: 'neutral', target: 'neutral', blend: 0, strength: 1.0, transitionSpeed: 3.0,

      setExpression(name, strength = 1.0) {
        if (!scanData || !scanData.expressions || !scanData.expressions[name]) return;
        this.target = name; this.strength = strength; this.blend = 0;
      },

      update(dt) {
        if (this.target === 'neutral' || this.blend >= 1) return;
        this.blend = Math.min(1, this.blend + dt * this.transitionSpeed);
        this.applyToWorkingBuffer();
      },

      applyToWorkingBuffer() {
        const expr = scanData?.expressions?.[this.target];
        if (!expr || !expr.landmarks || !workingBuffer || !baseLMs) return;
        const t = this.blend * this.strength;
        for (let i = 0; i < NUM; i++) {
          const d = expr.landmarks[i] || { x: 0, y: 0, z: 0 };
          workingBuffer[i].x = baseLMs[i].x + d.x * FACE_SCALE * t;
          workingBuffer[i].y = baseLMs[i].y - d.y * FACE_SCALE_Y * t;
          workingBuffer[i].z = baseLMs[i].z + (d.z || 0) * FACE_SCALE_Z * t;
        }
      },

      reset() {
        this.current = 'neutral'; this.target = 'neutral'; this.blend = 0;
        if (workingBuffer && baseLMs) {
          for (let i = 0; i < NUM; i++) {
            workingBuffer[i].x = baseLMs[i].x;
            workingBuffer[i].y = baseLMs[i].y;
            workingBuffer[i].z = baseLMs[i].z;
          }
        }
      },
    };

    // --- Wave 2: HeadMotion engine ---
    const HeadMotion = {
      phase: Math.random() * Math.PI * 2,
      targetYaw: 0, targetPitch: 0, targetRoll: 0,
      curYaw: 0, curPitch: 0, curRoll: 0,
      nextShift: 2,

      update(dt) {
        if (!scanData || !scanData.headProfile) return null;
        this.nextShift -= dt;
        if (this.nextShift <= 0) {
          const hp = scanData.headProfile;
          const r = () => (Math.random() - 0.5) * 2;
          const amp = (v) => Array.isArray(v) ? Math.max(Math.abs(v[0]||0), Math.abs(v[1]||0)) : (v || 0.15);
          this.targetYaw = r() * amp(hp.yawRange);
          this.targetPitch = r() * amp(hp.pitchRange);
          this.targetRoll = r() * amp(hp.rollRange);
          this.nextShift = 1.5 + Math.random() * 3;
        }
        const spd = Math.min(1, dt * 2.5);
        this.curYaw += (this.targetYaw - this.curYaw) * spd;
        this.curPitch += (this.targetPitch - this.curPitch) * spd;
        this.curRoll += (this.targetRoll - this.curRoll) * spd;
        this.targetYaw *= 0.995; this.targetPitch *= 0.995; this.targetRoll *= 0.995;
        return { yaw: this.curYaw, pitch: this.curPitch, roll: this.curRoll };
      },
    };

    // --- Wave 2: Iris position helper ---
    function computeIrisPositions(gazeX, gazeY) {
      const leftEyeCenter = { x: 0, y: 0, z: 0 }; let leftN = 0;
      const rightEyeCenter = { x: 0, y: 0, z: 0 }; let rightN = 0;
      const leftEyeIdx = [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7];
      const rightEyeIdx = [362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382];
      for (const idx of leftEyeIdx) {
        if (workingBuffer[idx]) { leftEyeCenter.x += workingBuffer[idx].x; leftEyeCenter.y += workingBuffer[idx].y; leftEyeCenter.z += workingBuffer[idx].z; leftN++; }
      }
      for (const idx of rightEyeIdx) {
        if (workingBuffer[idx]) { rightEyeCenter.x += workingBuffer[idx].x; rightEyeCenter.y += workingBuffer[idx].y; rightEyeCenter.z += workingBuffer[idx].z; rightN++; }
      }
      if (leftN > 0) { leftEyeCenter.x /= leftN; leftEyeCenter.y /= leftN; leftEyeCenter.z /= leftN; }
      if (rightN > 0) { rightEyeCenter.x /= rightN; rightEyeCenter.y /= rightN; rightEyeCenter.z /= rightN; }
      return {
        left: { x: leftEyeCenter.x + gazeX * 0.07, y: leftEyeCenter.y + gazeY * 0.06, z: leftEyeCenter.z + 0.03 },
        right: { x: rightEyeCenter.x + gazeX * 0.07, y: rightEyeCenter.y + gazeY * 0.06, z: rightEyeCenter.z + 0.03 },
      };
    }

    // --- TTS (Wave 4) ---
    let ttsVoices = [];
    let ttsPrimed = false;

    function unlockSpeech() {
      if (ttsPrimed) return;
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance('');
        u.volume = 0; speechSynthesis.speak(u); ttsPrimed = true;
      }
    }

    function pickVoice(prefix) {
      if (!ttsVoices.length && 'speechSynthesis' in window) ttsVoices = speechSynthesis.getVoices();
      return ttsVoices.find(v => v.lang.startsWith(prefix)) || null;
    }

    function say(text) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) { resolve(); return; }
        const u = new SpeechSynthesisUtterance(text);
        u.lang = /[\u4e00-\u9fff]/.test(text) ? 'zh-CN' : 'en-US';
        u.voice = pickVoice(u.lang.substring(0, 2));
        u.rate = 1.02;
        let resolved = false;
        u.onstart = () => { VisemeEngine.buildSyllablePlan(text); VisemeEngine.talking = true; };
        u.onend = () => { if (!resolved) { resolved = true; VisemeEngine.talking = false; resolve(); } };
        u.onerror = () => { if (!resolved) { resolved = true; VisemeEngine.talking = false; resolve(); } };
        speechSynthesis.speak(u);
        setTimeout(() => { if (!resolved) { resolved = true; VisemeEngine.talking = false; resolve(); } }, 600 + text.length * 90);
      });
    }

    // --- Chat history (Wave 4) — persisted to localStorage ---
    let chatHistory = JSON.parse(localStorage.getItem('dassein_history') || '[]');
    let abortController = null;

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg-line ' + role;
      div.textContent = text;
      convoEl.appendChild(div);
      convoEl.scrollTop = convoEl.scrollHeight;
    }

    // --- Wave 4: ask function (streaming chat → viseme → speak) ---
    async function ask(text) {
      if (!text.trim()) return;
      speechSynthesis.cancel();
      VisemeEngine.talking = false;
      if (abortController) abortController.abort();
      abortController = new AbortController();

      unlockSpeech();
      addMessage('user', text);

      const replyDiv = document.createElement('div');
      replyDiv.className = 'msg-line assistant streaming';
      convoEl.appendChild(replyDiv);
      let fullReply = '';

      try {
        const r = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: chatHistory.slice(-10) }),
          signal: abortController.signal,
        });

        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let startedSpeaking = false;

        outerLoop:
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') { fullReply += ''; break outerLoop; }
            try {
              const { token } = JSON.parse(data);
              fullReply += token;
              replyDiv.textContent = fullReply;
              convoEl.scrollTop = convoEl.scrollHeight;

              if (!startedSpeaking && fullReply.length > 20) {
                startedSpeaking = true;
                VisemeEngine.buildSyllablePlan(fullReply);
                VisemeEngine.talking = true;
                say(fullReply).then(() => { replyDiv.classList.remove('streaming'); });
              }
            } catch {}
          }
        }

        if (!startedSpeaking && fullReply) {
          VisemeEngine.buildSyllablePlan(fullReply);
          VisemeEngine.talking = true;
          await say(fullReply);
        }

        replyDiv.classList.remove('streaming');
        chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: fullReply });
        try { localStorage.setItem('dassein_history', JSON.stringify(chatHistory.slice(-50))); } catch (_) {}
      } catch (err) {
        if (err.name === 'AbortError') return;
        replyDiv.textContent = 'Could not reach the agent. Is the server running?';
        replyDiv.classList.remove('streaming');
      } finally {
        abortController = null;
      }
    }

    // --- Voice Input (F21-F25): VAD + Recording + Continuous mode ---
    let micStream = null;
    let audioCtx = null;
    let analyser = null;
    let vadInterval = null;
    let recorder = null;
    let recorderChunks = [];
    let continuousMode = false;
    let contLoopActive = false;
    let contAbort = false;

    async function ensureMic() {
      if (micStream) return micStream;
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      return micStream;
    }

    function ensureAudioCtx() {
      if (audioCtx) return audioCtx;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      return audioCtx;
    }

    function getRMS() {
      if (!analyser) return 0;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) { const v = data[i] / 128 - 1; sum += v * v; }
      return Math.sqrt(sum / data.length);
    }

    function startRecording() {
      return new Promise((resolve) => {
        if (!micStream) { resolve(null); return; }
        const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' :
                     MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        recorderChunks = [];
        recorder = new MediaRecorder(micStream, mime ? { mimeType: mime } : {});
        recorder.ondataavailable = (e) => { if (e.data.size > 0) recorderChunks.push(e.data); };
        recorder.onstop = () => resolve(new Blob(recorderChunks, { type: mime || 'audio/webm' }));
        recorder.start();
      });
    }

    function stopRecording() {
      if (recorder && recorder.state !== 'inactive') recorder.stop();
    }

    async function transcribeRecording(blob) {
      if (!blob || blob.size === 0) return '';
      const form = new FormData();
      form.append('audio', blob, 'recording.' + (blob.type.includes('mp4') ? 'mp4' : 'webm'));
      try {
        const r = await fetch('/api/transcribe', { method: 'POST', body: form });
        const data = await r.json();
        return data.text || '';
      } catch {
        return '';
      }
    }

    function startVAD(callback) {
      if (vadInterval) return;
      const THRESHOLD = 0.015;
      const SILENCE_TICKS = 16;
      const WARMUP_TICKS = 6;
      let silenceCount = 0;
      let warmupCount = 0;
      const source = audioCtx.createMediaStreamSource(micStream);
      source.connect(analyser);
      vadInterval = setInterval(() => {
        const rms = getRMS();
        if (rms > THRESHOLD) { silenceCount = 0; warmupCount++; }
        else { silenceCount++; }
        if (warmupCount >= WARMUP_TICKS && silenceCount >= SILENCE_TICKS) {
          callback();
        }
      }, 150);
    }

    function stopVAD() {
      if (vadInterval) { clearInterval(vadInterval); vadInterval = null; }
    }

    function setContState(st) {
      micBtn.classList.remove('live', 'cont-active');
      if (st === 'live') { micBtn.classList.add('live'); micBtn.textContent = 'Stop'; }
      else if (st === 'cont-active') { micBtn.classList.add('cont-active'); micBtn.textContent = 'Continuous \u00b7 on'; }
      else { micBtn.textContent = 'Continuous'; }
    }

    async function conversationStep() {
      if (contAbort) { contAbort = false; contLoopActive = false; return; }
      unlockSpeech();
      setContState('live');
      const blobP = startRecording();
      startVAD(async () => {
        stopVAD();
        stopRecording();
        setContState('cont-active');
        const blob = await blobP;
        const text = await transcribeRecording(blob);
        if (!text || text.startsWith('Transcribed') || text === '(Transcription failed)') {
          if (continuousMode && !contAbort) {
            setTimeout(() => conversationStep(), 300);
          } else {
            contLoopActive = false;
          }
          return;
        }
        chatInput.value = text;
        await ask(text);
        chatInput.value = '';
        if (continuousMode && !contAbort) {
          setTimeout(() => conversationStep(), 300);
        } else {
          contLoopActive = false;
        }
      });
    }

    function enterContinuous() {
      if (continuousMode) return;
      continuousMode = true;
      contAbort = false;
      contLoopActive = true;
      ensureMic().then(() => {
        ensureAudioCtx();
        audioCtx.resume();
        conversationStep();
      }).catch(() => {
        convoEl.textContent = 'Mic access denied.';
        continuousMode = false;
        setContState(null);
      });
    }

    function exitContinuous() {
      continuousMode = false;
      contAbort = true;
      stopVAD();
      stopRecording();
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; analyser = null; }
      setContState(null);
    }

    // --- Resize ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // --- Chat ---
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const convoEl = document.getElementById('convo');

    // Restore history UI on load
    for (const m of chatHistory.slice(-20)) {
      const div = document.createElement('div');
      div.className = 'msg-line ' + m.role;
      div.textContent = m.content;
      convoEl.appendChild(div);
    }

    sendBtn.addEventListener('click', () => { ask(chatInput.value); chatInput.value = ''; });
    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { ask(chatInput.value); chatInput.value = ''; } });

    micBtn.addEventListener('click', () => {
      if (micBtn.classList.contains('live')) {
        stopVAD(); stopRecording(); setContState(null);
      } else if (continuousMode) {
        exitContinuous();
      } else {
        unlockSpeech();
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          const rec = new SR();
          rec.lang = 'en-US'; rec.interimResults = false; rec.continuous = false;
          rec.onresult = (e) => { const t = e.results[0][0].transcript; chatInput.value = t; ask(t); chatInput.value = ''; setContState(null); };
          rec.onerror = () => { setContState(null); };
          rec.onend = () => { setContState(null); };
          setContState('live');
          rec.start();
        } else {
          enterContinuous();
        }
      }
    });

    window.__contHooks = { enterContinuous, exitContinuous, setContState, transcribeRecording };

    // --- Wave 5: window.agentAvatar public API ---
    window.agentAvatar = {
      loaded: true,
      setTalking(v) { VisemeEngine.talking = v; if (!v) VisemeEngine.stop(); },
      speak(text) { unlockSpeech(); VisemeEngine.buildSyllablePlan(text); say(text); },
      lookAt(x, y) { /* gaze tracking from external source */ },
      express(name, strength) { EmotionState.setExpression(name, strength); },
      loadProfile(data) { /* future: dynamic profile loading */ },
      resetFace() { EmotionState.reset(); },
      _setBlink(b) {},
    };

    // --- Wave 5: Test hooks ---
    window.__testHooks = {
      get VisemeEngine() { return VisemeEngine; },
      get EmotionState() { return EmotionState; },
      get HeadMotion() { return HeadMotion; },
      get behavior() { return window.__scene?.behavior; },
      get scanData() { return scanData; },
      get workingBuffer() { return workingBuffer; },
      get jawWeights() { return jawWeights; },
      get mouthCavityMesh() { return faceMouthCavity; },
    };
  </script>
</body>
</html>
