<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dassein</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Caveat:wght@400;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05080f;
      overflow: hidden;
      font-family: "Space Grotesk", system-ui, sans-serif;
      cursor: default;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(1200px 800px at 50% 32%, #0c0c14, #06060a);
    }
    #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
    #overlay {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #overlay h1 {
      color: #b9b6c2; font-family: "Playfair Display", serif;
      font-size: clamp(56px, 10vw, 120px); font-weight: 700;
      letter-spacing: -0.03em; opacity: 0.85;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    #agent-ui {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 32px 40px; gap: 14px;
      opacity: 0; transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #agent-ui.visible { opacity: 1; pointer-events: all; }

    .stage {
      width: min(78vmin, 600px); aspect-ratio: 1;
      border-radius: 50%; overflow: hidden; position: relative;
      box-shadow: 0 0 60px -10px rgba(0, 212, 255, 0.08), 0 20px 60px -15px rgba(0, 0, 0, 0.8);
    }
    .stage canvas { display: block; width: 100%; height: 100%; }
    .stage::after {
      content: ''; position: absolute; inset: 0; z-index: 1;
      border-radius: 50%;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 212, 255, 0.015) 2px, rgba(0, 212, 255, 0.015) 4px),
                        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 212, 255, 0.015) 2px, rgba(0, 212, 255, 0.015) 4px);
      pointer-events: none;
    }

    .caption {
      display: flex; gap: 9px; align-items: center;
      font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #9a97a3; font-family: "Caveat", cursive;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #00d4ff; box-shadow: 0 0 12px #00d4ff; animation: pulse 2.4s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .bar { display: flex; gap: 10px; align-items: center; }

    button {
      background: #15151d; color: #aab4c0;
      border: 1px solid rgba(0, 212, 255, 0.12);
      padding: 9px 18px; border-radius: 999px;
      font: inherit; font-size: 13px; cursor: pointer;
      transition: all 0.25s;
    }
    button:hover { background: #1c1c28; border-color: rgba(0, 212, 255, 0.35); color: #b9b6c2; }
    #micBtn.live { background: #201518; border-color: #ff4466; color: #ffb3ba; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="overlay">
    <h1>Dassein</h1>
  </div>

  <div id="agent-ui">
    <div class="stage" id="stage">
      <canvas id="c"></canvas>
    </div>
    <div class="caption">
      <span class="dot"></span>
    </div>
    <div class="bar">
      <button id="micBtn">start voice</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VoiceRealtime } from './voice-realtime.js';
    import { VoiceConversation } from './voice-conversation.js';
    import { targetsFromSDF } from './sdf-core.mjs';


    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const NUM = 478;
    const FACE_SCALE = 2.8;
    const FACE_SCALE_Y = FACE_SCALE * 0.75;
    const FACE_SCALE_Z = 2.0;

    const CONTOURS = {
      faceOval: [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109],
      leftEye: [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7],
      rightEye: [362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382],
      lipsOuter: [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185],
      lipsInner: [78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95],
      leftBrow: [70,63,105,66,107,55,65,52,53,46],
      rightBrow: [300,293,334,296,336,285,295,282,283,276],
      noseBridge: [168,6,197,195,5,4,1],
      noseBottom: [1,2,98,327,1],
    };

    const KEY_NODE_INDICES = [1, 4, 6, 10, 33, 61, 63, 105, 133, 152, 159, 168, 263, 267, 291, 314, 362, 386, 397, 405, 454, 468, 473];
    const UPPER_LIDS = [159, 160, 161, 163, 386, 387, 385, 384];
    const LOWER_LIDS = [145, 144, 157, 374, 373, 390];
    const MOUTH_INNER = [13, 14, 78, 80, 81, 82, 87, 88, 95, 178, 191, 308, 310, 311, 312, 317, 318, 324, 402, 415];
    const MOUTH_OUTER = [0, 17, 37, 39, 40, 61, 91, 146, 181, 185, 267, 269, 270, 291, 314, 321, 375, 405, 409];

    let scanData = null;
    let faceLMs = null;
    let baseLMs = null;
    let workingBuffer = null;
    let state = 'landing';
    let currentShape = 'face';
    let shapeTargets = null;
    let shapeTargetEdgeIndices = null;
    let nnIndices = [];
    let faceNNIndices = [];

    // ═══ Scroll-Driven Rotation Controller ═══
    const ScrollController = (() => {
      // ── Configuration ──
      const CFG = {
        globeSpeedX: 0.0008,
        globeSpeedY: 0.0015,
        globeSpeedZ: 0.0003,
        reducedGlobeSpeedX: 0.00008,
        reducedGlobeSpeedY: 0.00015,
        reducedGlobeSpeedZ: 0.00003,
        scrollFactor: 0.00005,
        fallbackMouseFactor: 0.000015,
        damping: 0.96,
        maxSpinVelocity: 0.1,
        velocityDeadZone: 0.0005,
        faceIdleDelay: 400,
        faceSpringFast: 0.06,
        faceSpringSlow: 0.02,
        faceZoneThreshold: 0.35,
        faceSnapThreshold: 0.001,
        faceRestThreshold: 0.002,
        tapMaxMovement: 5,
        tapMaxDuration: 300,
      };

      let spinVelocity = 0;
      let globeAngleY = 0;
      let faceOffsetY = 0;
      let faceSpringActive = false;
      let faceSpringTimer = null;
      let lastScrollTime = 0;
      let consecutiveStillFrames = 0;
      let enabled = !REDUCED_MOTION;

      let touchStartX = 0, touchStartY = 0, touchStartTime = 0, touchActive = false, touchPrevX = 0;

      function handleWheel(e) {
        if (!enabled) return;
        if (typeof isAnimating !== 'undefined' && isAnimating) return;
        if (REDUCED_MOTION) return;
        e.preventDefault();
        let delta = 0, isTrackpad = false;
        if (e.deltaMode === WheelEvent.DOM_DELTA_PIXEL) {
          isTrackpad = true;
          delta = e.deltaX;
          if (Math.abs(delta) < 0.01 && e.shiftKey) delta = e.deltaY;
          if (Math.abs(delta) < 0.01) { delta = e.deltaY; isTrackpad = false; }
        } else {
          delta = e.deltaX;
          if (Math.abs(delta) < 0.01 && e.shiftKey) delta = e.deltaY;
          if (Math.abs(delta) < 0.01) delta = e.deltaY;
        }
        const factor = isTrackpad ? CFG.scrollFactor : CFG.fallbackMouseFactor;
        const addition = Math.sign(delta) * Math.min(Math.abs(delta) * factor, 0.003);
        spinVelocity += addition;
        spinVelocity = Math.max(-CFG.maxSpinVelocity, Math.min(CFG.maxSpinVelocity, spinVelocity));
        lastScrollTime = performance.now();
        consecutiveStillFrames = 0;
        if (faceSpringActive) faceSpringActive = false;
        if (faceSpringTimer) { clearTimeout(faceSpringTimer); faceSpringTimer = null; }
      }

      function handleTouchStart(e) {
        if (!enabled || typeof isAnimating === 'undefined' || isAnimating || REDUCED_MOTION || e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchPrevX = touchStartX;
        touchStartTime = performance.now();
        touchActive = true;
        e.preventDefault();
      }

      function handleTouchMove(e) {
        if (!touchActive) return;
        e.preventDefault();
        const x = e.touches[0].clientX;
        const dx = x - touchPrevX;
        touchPrevX = x;
        if (Math.abs(dx) > 0.5) {
          spinVelocity += dx * 0.0001;
          spinVelocity = Math.max(-CFG.maxSpinVelocity, Math.min(CFG.maxSpinVelocity, spinVelocity));
          lastScrollTime = performance.now();
          consecutiveStillFrames = 0;
          if (faceSpringActive) faceSpringActive = false;
          if (faceSpringTimer) { clearTimeout(faceSpringTimer); faceSpringTimer = null; }
        }
      }

      function handleTouchEnd(e) {
        if (!touchActive) return;
        touchActive = false;
        const totalDx = (e.changedTouches[0]?.clientX || touchPrevX) - touchStartX;
        const totalDy = (e.changedTouches[0]?.clientY || touchStartY) - touchStartY;
        const duration = performance.now() - touchStartTime;
        const distance = Math.sqrt(totalDx * totalDx + totalDy * totalDy);
        if (distance < CFG.tapMaxMovement && duration < CFG.tapMaxDuration) return;
        e.preventDefault();
      }

      function update(dt) {
        if (REDUCED_MOTION) {
          globeAngleY += CFG.reducedGlobeSpeedY * dt * 60;
          return;
        }
        spinVelocity *= Math.pow(CFG.damping, dt * 60);
        if (Math.abs(spinVelocity) < CFG.velocityDeadZone) {
          spinVelocity = 0;
          consecutiveStillFrames++;
        } else {
          consecutiveStillFrames = 0;
        }
        if (state === 'landing') {
          globeAngleY += (CFG.globeSpeedY + spinVelocity) * dt * 60;
        }
        if (state === 'agent') {
          faceOffsetY += spinVelocity * dt * 60;
          faceOffsetY = Math.max(-1.0, Math.min(1.0, faceOffsetY));
          const scrolledRecently = (performance.now() - lastScrollTime) < CFG.faceIdleDelay;
          const velocityDead = spinVelocity === 0 && consecutiveStillFrames >= 3;
          if (!scrolledRecently && velocityDead && !faceSpringActive) faceSpringActive = true;
          if (faceSpringActive) {
            const absOffset = Math.abs(faceOffsetY);
            const springRate = absOffset < CFG.faceZoneThreshold ? CFG.faceSpringFast : CFG.faceSpringSlow;
            faceOffsetY += (0 - faceOffsetY) * springRate * dt * 60;
            if (absOffset < CFG.faceSnapThreshold) {
              faceOffsetY = 0;
              faceSpringActive = false;
              consecutiveStillFrames = 0;
            }
          }
        }
      }

      function isFaceAtRest() {
        return Math.abs(faceOffsetY) < CFG.faceRestThreshold && !faceSpringActive;
      }

      function isFaceScrolling() {
        return Math.abs(spinVelocity) > CFG.velocityDeadZone || faceSpringActive;
      }

      function reset() {
        spinVelocity = 0;
        globeAngleY = 0;
        faceOffsetY = 0;
        faceSpringActive = false;
        consecutiveStillFrames = 0;
        lastScrollTime = 0;
        if (faceSpringTimer) { clearTimeout(faceSpringTimer); faceSpringTimer = null; }
      }

      return {
        get spinVelocity() { return spinVelocity; },
        get globeAngleY() { return globeAngleY; },
        get faceOffsetY() { return faceOffsetY; },
        get faceSpringActive() { return faceSpringActive; },
        get enabled() { return enabled; },
        CFG,
        handleWheel, handleTouchStart, handleTouchMove, handleTouchEnd,
        update, isFaceAtRest, isFaceScrolling, reset,
      };
    })();

    // --- Wave 1: Deformation weights (precomputed) ---
    let jawWeights = null;
    let jawCurveWeight = null;
    let noseBaseWeight = null;
    let cheekWeight = null;

    function computeJawWeights(lms) {
      const hingeA = lms[234], hingeB = lms[454];
      const chin = lms[152];
      const dx = hingeB.x - hingeA.x, dy = hingeB.y - hingeA.y, dz = hingeB.z - hingeA.z;
      const len2 = dx*dx + dy*dy + dz*dz;
      const maxDist = Math.sqrt(
        (() => { const c = chin; const t = ((c.x-hingeA.x)*dx + (c.y-hingeA.y)*dy + (c.z-hingeA.z)*dz) / len2; const px = hingeA.x + t*dx, py = hingeA.y + t*dy, pz = hingeA.z + t*dz; return (c.x-px)**2 + (c.y-py)**2 + (c.z-pz)**2; })()
      );
      const jw = new Float32Array(NUM);
      const jcw = new Float32Array(NUM);
      const nbw = new Float32Array(NUM);
      const cw = new Float32Array(NUM);
      const upperLipY = lms[13].y;
      const noseBaseSet = new Set([1,2,98,327]);
      const cheekSet = new Set([36,93,132,137,205,206,216,227,234,331,366,371,425,427,430,436,450,454,458]);
      const jawCurveIndices = [0,17,37,39,40,61,91,146,181,185,267,269,270,291,314,321,375,405,409];
      for (let i = 0; i < NUM; i++) {
        const p = lms[i];
        if (p.y > upperLipY) { jw[i] = 0; continue; }
        const t = ((p.x-hingeA.x)*dx + (p.y-hingeA.y)*dy + (p.z-hingeA.z)*dz) / len2;
        const px = hingeA.x + t*dx, py = hingeA.y + t*dy, pz = hingeA.z + t*dz;
        const d = Math.sqrt((p.x-px)**2 + (p.y-py)**2 + (p.z-pz)**2);
        const r = d / maxDist;
        jw[i] = Math.max(0, 1 - Math.cos(r * Math.PI) / 2 - 0.5);
        jcw[i] = jawCurveIndices.includes(i) ? jw[i] : 0;
        nbw[i] = noseBaseSet.has(i) ? 1 : 0;
        cw[i] = cheekSet.has(i) ? jw[i] * 0.5 : 0;
      }
      jawWeights = jw; jawCurveWeight = jcw; noseBaseWeight = nbw; cheekWeight = cw;
    }

    function normalizeVisemes(profile) {
      if (!profile || !profile.visemes) return;
      for (const key of ['A','E','O','U','F']) {
        const v = profile.visemes[key];
        if (v) v.jawOpen = Math.min(v.jawOpen, v.neutral?.jawOpen + 0.40 || 0.40);
      }
      if (profile.visemes.I) profile.visemes.I.jawOpen = profile.neutral.blendshapes?.jawOpen || 0;
      if (profile.visemes.M) profile.visemes.M.jawOpen = Math.min(profile.visemes.M.jawOpen, (profile.neutral.blendshapes?.jawOpen || 0) + 0.05);
    }

    // --- Scene ---
    const canvas = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.1, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    // --- IBL ---
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envTex = pmrem.fromScene(new RoomEnvironment()).texture;
    scene.environment = envTex;

    // --- Three-point lighting ---
    scene.add(new THREE.AmbientLight(0x1a1a2e, 0.6));
    const keyLight = new THREE.DirectionalLight(0xc8e8ff, 1.2);
    keyLight.position.set(1, 2, 3);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x334466, 0.5);
    fillLight.position.set(-2, 0.5, 1);
    scene.add(fillLight);

    // --- Fibonacci sphere ---
    function fibonacciSphere(n) {
      const pts = []; const phi = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < n; i++) {
        const y = 1 - (i / (n - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = phi * i;
        pts.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r });
      }
      return pts;
    }
    const icoPoints = fibonacciSphere(NUM);

    const positions = new Float32Array(NUM * 3);
    for (let i = 0; i < NUM; i++) {
      positions[i * 3] = icoPoints[i].x;
      positions[i * 3 + 1] = icoPoints[i].y;
      positions[i * 3 + 2] = icoPoints[i].z;
    }
    const icoGeo = new THREE.BufferGeometry();
    icoGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // NN edges with configurable k — more connectivity for non-spherical shapes
    function nnEdgesK(points, k) {
      const edges = []; const used = new Set();
      for (let i = 0; i < points.length; i++) {
        const ds = [];
        for (let j = 0; j < points.length; j++) {
          if (i === j) continue;
          const dx = points[i].x - points[j].x, dy = points[i].y - points[j].y, dz = points[i].z - points[j].z;
          ds.push({ idx: j, d: dx * dx + dy * dy + dz * dz });
        }
        ds.sort((a, b) => a.d - b.d);
        for (let kk = 0; kk < Math.min(k, ds.length); kk++) {
          const key = Math.min(i, ds[kk].idx) + '-' + Math.max(i, ds[kk].idx);
          if (!used.has(key)) { used.add(key); edges.push([i, ds[kk].idx]); }
        }
      }
      return edges;
    }

    // Point cloud
    const icoDotMat = new THREE.PointsMaterial({
      size: 0.035, color: 0x00d4ff,
      blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.55,
    });
    const icoCloud = new THREE.Points(icoGeo, icoDotMat);

    // Neighbor wireframe
    function nearestNeighborEdges(lms, k) {
      const edges = []; const used = new Set();
      for (let i = 0; i < lms.length; i++) {
        const ds = [];
        for (let j = 0; j < lms.length; j++) {
          if (i === j) continue;
          const dx = lms[i].x - lms[j].x, dy = lms[i].y - lms[j].y, dz = lms[i].z - lms[j].z;
          ds.push({ idx: j, d: dx * dx + dy * dy + dz * dz });
        }
        ds.sort((a, b) => a.d - b.d);
        for (let kk = 0; kk < Math.min(k, ds.length); kk++) {
          const key = Math.min(i, ds[kk].idx) + '-' + Math.max(i, ds[kk].idx);
          if (!used.has(key)) { used.add(key); edges.push([i, ds[kk].idx]); }
        }
      }
      return edges;
    }
    const nnEdges = nearestNeighborEdges(icoPoints, 6);
    nnIndices = [];
    for (const [a, b] of nnEdges) nnIndices.push(a, b);

    const icoGroup = new THREE.Group();

    // Edge wireframe — shares icoGeo's position buffer so morph drives both
    const icoEdgeGeo = new THREE.BufferGeometry();
    icoEdgeGeo.setAttribute('position', icoGeo.attributes.position);
    icoEdgeGeo.setIndex(nnIndices);
    icoEdgeGeo.setDrawRange(0, nnIndices.length);
    const icoEdgeMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.28 });
    const icoEdges = new THREE.LineSegments(icoEdgeGeo, icoEdgeMat);
    icoGroup.add(icoEdges);

    const icoEdgeGlowMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.10, depthTest: false, depthWrite: false });
    const icoEdgeGlowGeom = new THREE.BufferGeometry();
    icoEdgeGlowGeom.setAttribute('position', icoGeo.attributes.position);
    icoEdgeGlowGeom.setIndex([...nnIndices]);
    icoEdgeGlowGeom.setDrawRange(0, nnIndices.length);
    const icoEdgeGlow = new THREE.LineSegments(icoEdgeGlowGeom, icoEdgeGlowMat);
    icoGroup.add(icoEdgeGlow);

    function setWireframeEdgeIndices(indices) {
      icoEdgeGeo.setIndex(indices);
      icoEdgeGeo.setDrawRange(0, indices.length);
      icoEdgeGlow.geometry.setIndex(indices);
      icoEdgeGlow.geometry.setDrawRange(0, indices.length);
    }

    icoGroup.add(icoCloud);
    scene.add(icoGroup);

    // --- Face wireframe (pre-built, opacity 0) ---
    function contourEdges(contours) {
      const e = [];
      for (const c of Object.values(contours)) {
        for (let i = 0; i < c.length - 1; i++) e.push([c[i], c[i + 1]]);
        if (c.length > 2) e.push([c[c.length - 1], c[0]]);
      }
      return e;
    }

    let faceContourLines = null;
    let faceContourGlow = null;
    let faceMouthCavity = null;
    let faceKeyNodes = [];
    let faceIrisNodes = [];

    function buildFace(lms) {
      const fp = new Float32Array(NUM * 3);
      for (let i = 0; i < NUM; i++) {
        fp[i * 3] = lms[i].x; fp[i * 3 + 1] = lms[i].y; fp[i * 3 + 2] = lms[i].z;
      }
      const fGeo = new THREE.BufferGeometry();
      fGeo.setAttribute('position', new THREE.BufferAttribute(fp, 3));

      const edgeList = contourEdges(CONTOURS);
      const idx = [];
      for (const [a, b] of edgeList) idx.push(a, b);
      fGeo.setIndex(idx);
      fGeo.setDrawRange(0, idx.length);

      const cMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0, depthTest: false });
      faceContourLines = new THREE.LineSegments(fGeo, cMat);
      faceContourLines.renderOrder = 1;
      icoGroup.add(faceContourLines);

      const gMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
      faceContourGlow = new THREE.LineSegments(fGeo.clone(), gMat);
      icoGroup.add(faceContourGlow);

      // Mouth cavity
      const cavityTris = []; const mIdx = [...MOUTH_INNER, ...MOUTH_OUTER];
      for (let i = 0; i < mIdx.length; i++) {
        for (let j = i + 1; j < mIdx.length; j++) {
          for (let k = j + 1; k < mIdx.length; k++) {
            cavityTris.push(mIdx[i], mIdx[j], mIdx[k]);
          }
        }
      }
      const cGeo = new THREE.BufferGeometry();
      const cPos = new Float32Array(NUM * 3);
      cPos.set(fp);
      cGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
      cGeo.setIndex(cavityTris.slice(0, 3000));
      cGeo.computeVertexNormals();
      const cMatMouth = new THREE.MeshBasicMaterial({ color: 0x000a1a, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
      faceMouthCavity = new THREE.Mesh(cGeo, cMatMouth);
      faceMouthCavity.renderOrder = 0;
      icoGroup.add(faceMouthCavity);

      // Key nodes (subtle landmark markers)
      const knGeo = new THREE.SphereGeometry(0.008, 6, 6);
      const knMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0 });
      for (const idx of KEY_NODE_INDICES) {
        if (idx >= NUM) continue;
        const dot = new THREE.Mesh(knGeo, knMat);
        dot.position.set(lms[idx].x, lms[idx].y, lms[idx].z);
        dot.userData.idx = idx;
        icoGroup.add(dot);
        faceKeyNodes.push(dot);
      }

      // Iris nodes
      const irGeo = new THREE.SphereGeometry(0.028, 12, 12);
      const irMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 });
      for (const idx of [468, 473]) {
        if (idx >= NUM) continue;
        const dot = new THREE.Mesh(irGeo, irMat);
        dot.position.set(lms[idx].x, lms[idx].y, lms[idx].z);
        dot.userData.idx = idx;
        icoGroup.add(dot);
        faceIrisNodes.push(dot);

        const glowGeo = new THREE.SphereGeometry(0.045, 12, 12);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.copy(dot.position);
        glow.userData.idx = idx;
        icoGroup.add(glow);
        faceIrisNodes.push(glow);
      }

      return fp;
    }

    const facePositions = new Float32Array(NUM * 3);

    function updateFaceGeometry(src) {
      if (faceContourLines) {
        const a = faceContourLines.geometry.attributes.position.array;
        for (let i = 0; i < NUM * 3; i++) a[i] = src[i];
        faceContourLines.geometry.attributes.position.needsUpdate = true;
      }
      if (faceContourGlow) {
        const a = faceContourGlow.geometry.attributes.position.array;
        for (let i = 0; i < NUM * 3; i++) a[i] = src[i];
        faceContourGlow.geometry.attributes.position.needsUpdate = true;
      }
      if (faceMouthCavity) {
        const a = faceMouthCavity.geometry.attributes.position.array;
        const innerLip = [78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95];
        const n = innerLip.length;
        for (let i = 0; i < n; i++) {
          const idx = innerLip[i];
          a[(i+1)*3]     = src[idx*3];
          a[(i+1)*3 + 1] = src[idx*3 + 1];
          a[(i+1)*3 + 2] = src[idx*3 + 2];
        }
        let cx = 0, cy = 0, cz = 0;
        for (let i = 0; i < n; i++) { cx += a[(i+1)*3]; cy += a[(i+1)*3 + 1]; cz += a[(i+1)*3 + 2]; }
        a[0] = cx/n; a[1] = cy/n; a[2] = cz/n;
        faceMouthCavity.geometry.attributes.position.needsUpdate = true;
        faceMouthCavity.geometry.computeVertexNormals();
      }
      for (const dot of [...faceKeyNodes, ...faceIrisNodes]) {
        const idx = dot.userData.idx;
        if (idx !== undefined && idx < NUM) {
          dot.position.set(src[idx * 3], src[idx * 3 + 1], src[idx * 3 + 2]);
        }
      }
    }

    // --- Viseme data structures ---
    const VOWEL_VISEMES = { a: 'A', e: 'E', i: 'I', o: 'O', u: 'U' };
    const CONSONANT_VISEMES = {
      b:'M', p:'M', m:'M', f:'F', v:'F', w:'U',
      t:'E', d:'E', s:'E', z:'E', n:'E', l:'E', r:'E', th:'E', dh:'E',
      k:'A', g:'A', ng:'A', h:'A', y:'I', ch:'I', sh:'I', zh:'I', j:'I',
    };
    const FUNCTION_WORDS = new Set(['the','a','an','in','on','at','to','for','of','and','or','but',
      'is','are','was','were','be','been','have','has','had','do','does','did',
      'will','would','can','could','shall','should','may','might','not','no',
      'it','its','this','that','these','those','i','you','he','she','we','they',
      'my','your','his','her','our','their','me','him','us','them']);
    const VOWEL_SET = new Set(['a','e','i','o','u']);

    // --- Load scan ---
    async function loadScan() {
      const r = await fetch('/data/robota_scan.json');
      scanData = await r.json();
      const lm = scanData.neutral.landmarksNormalized || scanData.neutral.landmarks;
      faceLMs = lm.map(p => ({
        x: p.x * FACE_SCALE, y: -p.y * FACE_SCALE_Y, z: (p.z || 0) * FACE_SCALE_Z,
      }));
      baseLMs = faceLMs.map(p => ({ ...p }));
      workingBuffer = faceLMs.map(p => ({ ...p }));

      // Compute triangulated NN edges for face (used as wireframe during face mode)
      const faceNNEdges = nearestNeighborEdges(faceLMs, 6);
      faceNNIndices = [];
      for (const [a, b] of faceNNEdges) faceNNIndices.push(a, b);

      // Build face wireframe
      const fp = buildFace(faceLMs);
      facePositions.set(fp);

      // Expose
      computeJawWeights(faceLMs);
      normalizeVisemes(scanData);

      window.__scene = {
        state, icoGeo, icoCloud, icoDotMat, icoGroup, icoEdges, icoEdgeMat,
        faceContourLines, faceContourGlow, faceMouthCavity,
        faceKeyNodes, faceIrisNodes,
        faceLMs, baseLMs, workingBuffer, triggerTransform, resetToLanding, scene, camera, renderer,
        icoPoints, positions, NUM, isAnimating: false,
        faceLandmarks3D: faceLMs, seedPositionsArr: positions,
        jawWeights, jawCurveWeight, noseBaseWeight, cheekWeight,
        scanData, behavior: null,
        spec: null,
        get specLibrary() { return CURATED_SPECS; },
        faceNNIndices,
      };
    }

    await loadScan();

    // --- Hit sphere ---
    const hitGeo = new THREE.SphereGeometry(1.0, 16, 16);
    const hitMat = new THREE.MeshBasicMaterial({ visible: false });
    const hitSphere = new THREE.Mesh(hitGeo, hitMat);
    scene.add(hitSphere);

    // --- Transform ---
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    let isAnimating = false;
    let activeMorphTween = null;

    function interruptMorph() {
      if (activeMorphTween) { activeMorphTween.kill(); activeMorphTween = null; }
      isAnimating = false;
    }

    function triggerTransform() {
      if (state !== 'landing' || isAnimating) return;
      isAnimating = true;
      state = 'transforming';
      if (window.__scene) window.__scene.state = state;

      gsap.to('#overlay', { opacity: 0, duration: 0.5 });

      // Reset accumulated rotation so face aligns with world
      icoGroup.rotation.set(0, 0, 0);
      ScrollController.reset();

      const targets = faceLMs;
      let indicesSwapped = false;
      const morphObj = { progress: 0 };
      gsap.to(morphObj, {
        progress: 1, duration: 2.0, ease: 'power2.inOut',
        onUpdate: () => {
          const t = easeInOutCubic(morphObj.progress);
          for (let i = 0; i < NUM; i++) {
            const sx = icoPoints[i].x, sy = icoPoints[i].y, sz = icoPoints[i].z;
            const fx = targets[i].x, fy = targets[i].y, fz = targets[i].z;
            positions[i * 3] = sx + (fx - sx) * t;
            positions[i * 3 + 1] = sy + (fy - sy) * t;
            positions[i * 3 + 2] = sz + (fz - sz) * t;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          updateFaceGeometry(positions);

          // Crossfade: sphere NN edges fade out → switch indices → face NN edges fade in
          if (t < 0.5) {
            const p = t * 2;
            icoEdgeMat.opacity = 0.28 * (1 - p);
            icoEdgeGlowMat.opacity = 0.10 * (1 - p);
          } else {
            if (faceNNIndices && !indicesSwapped) {
              setWireframeEdgeIndices(faceNNIndices);
              indicesSwapped = true;
            }
            const p = (t - 0.5) * 2;
            icoEdgeMat.opacity = 0.35 * p;
            icoEdgeGlowMat.opacity = 0.12 * p;
          }
          faceContourLines.material.opacity = 0.75 * t;
          faceContourGlow.material.opacity = 0.18 * t;
          faceMouthCavity.material.opacity = 0.55 * t;
          faceKeyNodes.forEach(n => { n.material.opacity = 0.25 * t; });
          faceIrisNodes.forEach(n => {
            n.material.opacity = (n.geometry.parameters?.radius > 0.03 ? 0.15 : 1) * t;
          });
        },
        onComplete: () => {
          for (let i = 0; i < NUM; i++) {
            positions[i * 3] = targets[i].x;
            positions[i * 3 + 1] = targets[i].y;
            positions[i * 3 + 2] = targets[i].z;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          updateFaceGeometry(positions);
          if (faceNNIndices) setWireframeEdgeIndices(faceNNIndices);
          icoEdgeMat.opacity = 0.35;
          icoEdgeGlowMat.opacity = 0.12;
        }
      });

      gsap.to(camera.position, { z: 4.5, duration: 2.0, delay: 0.3, ease: 'power2.inOut' });
      gsap.to('#agent-ui', { opacity: 1, duration: 0.6, delay: 2.2, onStart: () => { document.getElementById('agent-ui').classList.add('visible'); } });

      gsap.to({}, { delay: 2.5, onComplete: () => { state = 'agent'; isAnimating = false; if (window.__scene) window.__scene.state = state; startBehavior(); } });
    }

    // --- Reset to landing ---
    function resetToLanding() {
      if (state === 'landing' || isAnimating) return;
      isAnimating = true;
      ScrollController.reset();
      state = 'resetting';
      if (window.__scene) window.__scene.state = state;

      // Kill any active GSAP tweens on these objects
      gsap.killTweensOf('#overlay');
      gsap.killTweensOf('#agent-ui');
      gsap.killTweensOf(icoDotMat);
      gsap.killTweensOf(camera.position);
      gsap.killTweensOf(icoEdgeMat);
      gsap.killTweensOf(faceContourLines.material);
      gsap.killTweensOf(faceContourGlow.material);
      gsap.killTweensOf(faceMouthCavity.material);
      faceKeyNodes.forEach(n => gsap.killTweensOf(n.material));

      faceIrisNodes.forEach(n => gsap.killTweensOf(n.material));

      const startPos = new Float32Array(positions);

      const morphObj = { progress: 0 };
      gsap.to(morphObj, {
        progress: 1, duration: 1.5, ease: 'power2.inOut',
        onUpdate: () => {
          const t = easeInOutCubic(morphObj.progress);
          for (let i = 0; i < NUM; i++) {
            const sx = startPos[i * 3], sy = startPos[i * 3 + 1], sz = startPos[i * 3 + 2];
            const fx = icoPoints[i].x, fy = icoPoints[i].y, fz = icoPoints[i].z;
            positions[i * 3]     = sx + (fx - sx) * t;
            positions[i * 3 + 1] = sy + (fy - sy) * t;
            positions[i * 3 + 2] = sz + (fz - sz) * t;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          updateFaceGeometry(positions);

          // Reverse crossfade: face NN edges fade out → switch to sphere NN edges → fade in
          if (t < 0.5) {
            const p = t * 2;
            icoEdgeMat.opacity = 0.35 * (1 - p);
            icoEdgeGlowMat.opacity = 0.12 * (1 - p);
          } else {
            if (nnIndices) setWireframeEdgeIndices(nnIndices);
            const p = (t - 0.5) * 2;
            icoEdgeMat.opacity = 0.28 * p;
            icoEdgeGlowMat.opacity = 0.10 * p;
          }
          faceContourLines.material.opacity = 0.75 * (1 - t);
          faceContourGlow.material.opacity = 0.18 * (1 - t);
          faceMouthCavity.material.opacity = 0.55 * (1 - t);
          faceKeyNodes.forEach(n => { n.material.opacity = 0.25 * (1 - t); });
          faceIrisNodes.forEach(n => {
            n.material.opacity = (n.geometry.parameters?.radius > 0.03 ? 0.15 : 1) * (1 - t);
          });
        },
        onComplete: () => {
          for (let i = 0; i < NUM; i++) {
            positions[i * 3]     = icoPoints[i].x;
            positions[i * 3 + 1] = icoPoints[i].y;
            positions[i * 3 + 2] = icoPoints[i].z;
          }
          icoGeo.attributes.position.needsUpdate = true;
          icoEdgeGeo.attributes.position.needsUpdate = true;
          updateFaceGeometry(positions);
          if (nnIndices) setWireframeEdgeIndices(nnIndices);
          icoEdgeMat.opacity = 0.28;
          icoEdgeGlowMat.opacity = 0.10;
        }
      });

      // Restore camera
      gsap.to(camera.position, { z: 6, duration: 1.2, ease: 'power2.inOut' });

      // Restore overlay
      gsap.to('#overlay', { opacity: 1, duration: 0.4, delay: 0.3 });

      // Hide agent UI
      gsap.to('#agent-ui', { opacity: 0, duration: 0.3, onComplete: () => { document.getElementById('agent-ui').classList.remove('visible'); } });

      // Reset shape to face
      shapeTargets = null;
      shapeTargetEdgeIndices = null;
      currentShape = 'face';

      gsap.to({}, {
        delay: 1.8,
        onComplete: () => {
          state = 'landing'; isAnimating = false;
          if (window.__scene) window.__scene.state = state;
        }
      });
    }

    // --- Keyboard ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { resetToLanding(); }
    });

    // --- Shape morphing engine ---

    function weldVertices(positions, threshold) {
      const n = positions.length / 3;
      const unique = [];
      const indices = new Array(n);
      for (let i = 0; i < n; i++) {
        let found = -1;
        const ix = positions[i * 3], iy = positions[i * 3 + 1], iz = positions[i * 3 + 2];
        for (let j = 0; j < unique.length / 3; j++) {
          const dx = ix - unique[j * 3], dy = iy - unique[j * 3 + 1], dz = iz - unique[j * 3 + 2];
          if (dx * dx + dy * dy + dz * dz < threshold * threshold) { found = j; break; }
        }
        if (found >= 0) indices[i] = found;
        else { indices[i] = unique.length / 3; unique.push(ix, iy, iz); }
      }
      return { vertices: new Float32Array(unique), indices };
    }

    function farthestPointSampling(vertices, targetCount, seed) {
      const n = vertices.length / 3;
      if (targetCount > n) {
        // FPS can only pick distinct vertices; past the count it silently
        // re-selects the last one → collapsed clusters that read as horizontal
        // cross-sections. Fail loud so builders keep ≥ NUM unique verts.
        throw new Error(`farthestPointSampling: target ${targetCount} > available ${n} verts`);
      }
      const selected = new Array(targetCount);
      const distances = new Float32Array(n).fill(Infinity);
      selected[0] = seed % n;
      for (let i = 1; i < targetCount; i++) {
        const lastIdx = selected[i - 1];
        const lx = vertices[lastIdx * 3], ly = vertices[lastIdx * 3 + 1], lz = vertices[lastIdx * 3 + 2];
        let maxDist = -1, maxIdx = -1;
        for (let j = 0; j < n; j++) {
          const dx = vertices[j * 3] - lx, dy = vertices[j * 3 + 1] - ly, dz = vertices[j * 3 + 2] - lz;
          const d = dx * dx + dy * dy + dz * dz;
          if (d < distances[j]) distances[j] = d;
          if (distances[j] > maxDist) { maxDist = distances[j]; maxIdx = j; }
        }
        selected[i] = maxIdx;
      }
      return selected;
    }

    const GLB_MODEL_URL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb';

    async function loadGLBFromURL(url) {
      const loader = new GLTFLoader();
      let gltf;
      try {
        gltf = await new Promise((resolve, reject) => {
          loader.load(url, resolve, undefined, reject);
        });
      } catch (err) {
        throw new Error(
          `Could not load model from URL. Check that it points at a valid .glb and the host allows CORS: ${url}`
        );
      }
      const allVerts = [];
      gltf.scene.traverse((child) => {
        if (child.isMesh) {
          const pos = child.geometry.getAttribute('position');
          if (pos) {
            for (let i = 0; i < pos.count; i++) {
              allVerts.push(pos.getX(i), pos.getY(i), pos.getZ(i));
            }
          }
        }
      });
      if (allVerts.length === 0) return null;
      let cx = 0, cy = 0, cz = 0;
      for (let i = 0; i < allVerts.length; i += 3) { cx += allVerts[i]; cy += allVerts[i+1]; cz += allVerts[i+2]; }
      const n = allVerts.length / 3;
      cx /= n; cy /= n; cz /= n;
      let maxDist = 0;
      for (let i = 0; i < allVerts.length; i += 3) {
        allVerts[i] -= cx; allVerts[i+1] -= cy; allVerts[i+2] -= cz;
        maxDist = Math.max(maxDist, Math.hypot(allVerts[i], allVerts[i+1], allVerts[i+2]));
      }
      const scale = 0.5 / (maxDist || 1);
      for (let i = 0; i < allVerts.length; i++) allVerts[i] *= scale;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(allVerts), 3));
      const result = targetsFromGeometry(geo);
      geo.dispose();
      shapeTargets = result.targets;
      shapeTargetEdgeIndices = result.edgeIndices;
      return result.targets;
    }

    // Shared "geometry → wireframe net" step. Every shape — pill primitives,
    // procedural builders, GLB imports — passes through here: weld duplicates,
    // FPS down to exactly NUM points, then k-NN edges. Pure: returns the
    // {targets, edgeIndices} result without touching the shared globals.
    function targetsFromGeometry(geo) {
      geo.computeVertexNormals();
      const posAttr = geo.getAttribute('position');
      const rawVerts = new Float32Array(posAttr.array);
      const welded = weldVertices(rawVerts, 0.001);
      const selected = farthestPointSampling(welded.vertices, NUM, 0);
      const targets = new Array(NUM);
      const v = welded.vertices;
      for (let i = 0; i < NUM; i++) {
        const idx = selected[i] * 3;
        targets[i] = { x: v[idx], y: v[idx + 1], z: v[idx + 2] };
      }
      const fpsEdges = nearestNeighborEdges(targets, 6);
      const edgeIndices = [];
      for (const [a, b] of fpsEdges) edgeIndices.push(a, b);
      return { targets, edgeIndices };
    }

    // ─── Procedural builder registry (tier 1) ────────────────────────────
    // Every builder returns a THREE.BufferGeometry, then passes through
    // targetsFromGeometry() (weld → FPS → k-NN edges) to render as the
    // icosahedral wireframe net.
    //
    // Builder-conformance rule: every builder MUST produce ≥478 unique welded
    // verts. FPS can only pick distinct vertices — past the count it silently
    // re-selects the last one into collapsed clusters (the guard at
    // farthestPointSampling stays loud). Parameterized families tune their
    // tessellation so this holds at every parameter combination.
    //
    // Unified spec: { type, size='medium', params={}, mods={}, blend={with, ratio},
    // union=[...], parts=[...], seed, url }.
    //   parts (A1): compound forms. Each part = { type, params, pos, rot,
    //     scale, mods, seed }. First part is the anchor at the origin; others
    //     attach relative to it. rot = 'up'|'flat'|'side' or {preset, deg} —
    //     never raw Euler angles. ≤12 parts, pos clamped to the ±0.8 work
    //     volume. Part points merge before weld → FPS (same as union/helix).
    // Bases are welded + FPS'd ONCE and cached by (type, params) only (small,
    // bounded ~80 entries; compounds cache under a composite parts key).
    // Mods, blend, size, and edges are cheap 478-point
    // array ops recomputed per spawn. Deterministic: seeded noise + fixed FPS
    // seed → same spec always produces the same net.
    //
    // G1: each name lands at its current absolute size. Native primitives
    // keep their exact geometry scale (BASE_SCALE 1); every other builder is
    // normalized to the tier-0 bulk (0.55r) via baseScaleFor. The requested
    // size is applied last, as a uniform factor on the targets.

    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    function hash3i(x, y, z, seed) {
      let h = seed ^ Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    // Trilinear value noise on integer lattice hashes, 0..1, fully deterministic.
    function valueNoise3(x, y, z, seed) {
      const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
      const fx = x - ix, fy = y - iy, fz = z - iz;
      const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
      const c000 = hash3i(ix, iy, iz, seed), c100 = hash3i(ix + 1, iy, iz, seed);
      const c010 = hash3i(ix, iy + 1, iz, seed), c110 = hash3i(ix + 1, iy + 1, iz, seed);
      const c001 = hash3i(ix, iy, iz + 1, seed), c101 = hash3i(ix + 1, iy, iz + 1, seed);
      const c011 = hash3i(ix, iy + 1, iz + 1, seed), c111 = hash3i(ix + 1, iy + 1, iz + 1, seed);
      const x00 = c000 + (c100 - c000) * ux, x10 = c010 + (c110 - c010) * ux;
      const x01 = c001 + (c101 - c001) * ux, x11 = c011 + (c111 - c011) * ux;
      const y0 = x00 + (x10 - x00) * uy, y1 = x01 + (x11 - x01) * uy;
      return y0 + (y1 - y0) * uz;
    }

    const NOISE_PROFILES = {
      gem:     { freq: 1.4, amp: 0.5, quant: 4 },
      rock:    { freq: 2.2, amp: 0.4, quant: 0 },
      crystal: { freq: 2.0, amp: 0.55, quant: 0 },
      pebble:  { freq: 1.0, amp: 0.22, quant: 0 },
      blob:    { freq: 0.7, amp: 0.5, quant: 0 },
    };

    function displacedIcosahedron(type) {
      const seed = hashString(type);
      const p = NOISE_PROFILES[type];
      // Detail 7 keeps the welded vertex count well above NUM so FPS always
      // has 478 distinct candidates (detail 4 collapses to ~252 → FPS dupes).
      const geo = new THREE.IcosahedronGeometry(0.8, 7);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const len = Math.sqrt(x * x + y * y + z * z) || 1;
        const n = valueNoise3((x / len) * p.freq, (y / len) * p.freq, (z / len) * p.freq, seed);
        let d = n;
        if (p.quant) d = Math.round(n * p.quant) / p.quant;
        const pole = type === 'crystal' ? 1 + Math.abs(y / len) * 0.9 : 1;
        const scale = 1 + (d - 0.5) * p.amp * 2 * pole;
        pos.setXYZ(i, x * scale, y * scale, z * scale);
      }
      if (type === 'crystal') geo.scale(0.8, 1.55, 0.8);
      geo.computeVertexNormals();
      return geo;
    }

    // Lathe profiles in the canonical [[y, r]...] convention — height first,
    // radius second (A3). Presets keep their existing silhouettes; an explicit
    // `profile` param overrides the preset so any simple solid-of-revolution
    // (cup, chess piece, lantern body) can be spelled out by spec.
    const LATHE_PROFILES = {
      vase:   [[-1, 0], [-0.9, 0.3], [-0.6, 0.62], [-0.25, 0.66], [0.05, 0.4], [0.3, 0.24], [0.48, 0.26], [0.52, 0.34], [0.85, 0.3]],
      goblet: [[-1, 0], [-1, 0.2], [-0.85, 0.2], [-0.7, 0.12], [-0.5, 0.06], [-0.3, 0.05], [0.05, 0.42], [0.3, 0.52], [0.55, 0.38], [0.75, 0.3], [0.85, 0.18], [0.85, 0]],
      rocket: [[-1, 0], [-1, 0.34], [0.15, 0.34], [0.45, 0.2], [0.72, 0.09], [0.95, 0]],
      bowl:   [[-0.72, 0], [-0.7, 0.3], [-0.55, 0.55], [-0.3, 0.62], [0.15, 0.62], [0.42, 0.5], [0.5, 0]],
    };

    // Subdivide each profile segment so the lathe has many distinct height
    // levels (a coarse 6-pt profile put nearly all FPS points on ~6 rings).
    function subdivideProfile(pts, perSeg) {
      const out = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const [y0, r0] = pts[i], [y1, r1] = pts[i + 1];
        for (let k = 0; k < perSeg; k++) out.push([y0 + (y1 - y0) * k / perSeg, r0 + (r1 - r0) * k / perSeg]);
      }
      out.push(pts[pts.length - 1]);
      return out;
    }

    function latheBuilder(name, params = {}) {
      // bulge scales every ring outward; waist constricts the mid-height rings.
      // Negative radii are clamped to 0 so malformed profiles never fold the
      // surface inside-out (profile sanitization, tier-2).
      const bulge = params.bulge ?? 0;
      const waist = params.waist ?? 0;
      const profile = params.profile || LATHE_PROFILES[name];
      if (!profile || profile.length < 2) throw new Error(`Unknown lathe profile: ${name}`);
      const pts = subdivideProfile(profile, 8).map(([y, r]) => {
        let rr = Math.max(0, r) * (1 + bulge);
        if (waist) rr *= 1 - waist * Math.max(0, 1 - Math.abs(y) * 1.2);
        return new THREE.Vector2(rr, y);
      });
      // 96 segments × subdivided profile → thousands of welded verts, so FPS
      // samples spread across the whole surface, not horizontal rings.
      return new THREE.LatheGeometry(pts, 96);
    }

    function polygonPts(n, r) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 - Math.PI / 2;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      return pts;
    }
    function starPts(sides = 5, inner = 0.45) {
      const pts = [];
      const n = sides * 2;
      for (let i = 0; i < n; i++) {
        const r = i % 2 === 0 ? 1.0 : inner;
        const a = (i / n) * Math.PI * 2 - Math.PI / 2;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      return pts;
    }
    function gearPts(teeth = 12) {
      const pts = [];
      const step = (Math.PI * 2) / (teeth * 4);
      for (let i = 0; i < teeth * 4; i++) {
        const a = i * step - Math.PI / 2;
        const r = (i % 4 === 0 || i % 4 === 1) ? 1.0 : 0.78;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      return pts;
    }
    function crossPts() {
      const a = 0.3, b = 1.0, c = 0.38;
      return [[-a, b], [a, b], [a, c], [b, c], [b, -c], [a, -c], [a, -b], [-a, -b], [-a, -c], [-b, -c], [-b, c], [-a, c]];
    }
    // Subdivide each outline edge so extruded shapes produce ≥478 welded
    // vertices (a bare star outline extruded to only ~20 welded verts).
    function subdivideOutline(pts, perEdge) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
        for (let k = 0; k < perEdge; k++) out.push([ax + (bx - ax) * k / perEdge, ay + (by - ay) * k / perEdge]);
      }
      return out;
    }
    // Midpoint-subdivide triangles once: injects interior points on the flat
    // faces so FPS samples the whole face, not just the rim outline.
    function subdivideTrianglesOnce(posArr, idxArr) {
      const pos = Array.from(posArr), idx = idxArr;
      const mid = new Map();
      const key = (a, b) => a < b ? a + '-' + b : b + '-' + a;
      const midOf = (a, b) => {
        const k = key(a, b);
        if (!mid.has(k)) {
          mid.set(k, pos.length / 3);
          pos.push((pos[a*3] + pos[b*3]) / 2, (pos[a*3+1] + pos[b*3+1]) / 2, (pos[a*3+2] + pos[b*3+2]) / 2);
        }
        return mid.get(k);
      };
      const out = [];
      for (let t = 0; t < idx.length; t += 3) {
        const a = idx[t], b = idx[t+1], c = idx[t+2];
        const ab = midOf(a, b), bc = midOf(b, c), ca = midOf(c, a);
        out.push(a, ab, ca, b, bc, ab, c, ca, bc, ab, bc, ca);
      }
      return { pos: new Float32Array(pos), idx: new Uint32Array(out) };
    }
    function extrudeBuilder(name, params = {}) {
      // Per-edge subdivision scales with the outline point count so extruded
      // families keep ≥478 welded verts at every parameter combination.
      // An explicit `profile` ([[x, y]...]) overrides the presets — any flat
      // outline shape (key head, cross-section, glyph) can be spelled out.
      let raw, perEdge;
      if (params.profile) {
        raw = params.profile;
        perEdge = Math.max(6, Math.round(240 / Math.max(3, raw.length)));
      } else if (name === 'star') {
        const sides = Math.max(3, Math.round(params.sides || 5));
        raw = starPts(sides, params.inner ?? 0.45);
        perEdge = Math.max(8, Math.round(75 / sides));
      } else if (name === 'gear') {
        const teeth = Math.max(3, Math.round(params.teeth || 12));
        raw = gearPts(teeth);
        perEdge = Math.max(4, Math.round(96 / teeth));
      } else if (name === 'cross') {
        raw = crossPts();
        perEdge = 20;
      } else { // polygon
        const sides = Math.max(3, Math.round(params.sides || 6));
        raw = polygonPts(sides, 1);
        perEdge = Math.max(20, Math.round(240 / sides));
      }
      const pts = subdivideOutline(raw, perEdge);
      const shape = new THREE.Shape();
      shape.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
      shape.closePath();
      // Thin slab: depth comparable to the FPS point spacing so k-NN bridges
      // front/back faces into one connected solid. Thick (0.6) slabs leave the
      // two faces as disconnected flat patterns. `depth` tunes it explicitly.
      const geo = new THREE.ExtrudeGeometry(shape, { depth: params.depth ?? 0.18, bevelEnabled: false });
      const pos = geo.getAttribute('position').array;
      const idx = geo.getIndex() ? geo.getIndex().array : new Array(pos.length / 3).fill(0).map((_, i) => i);
      const sub = subdivideTrianglesOnce(pos, idx);
      geo.dispose();
      const result = new THREE.BufferGeometry();
      result.setAttribute('position', new THREE.BufferAttribute(sub.pos, 3));
      result.setIndex(new THREE.BufferAttribute(sub.idx, 1));
      return result;
    }

    function spiralBuilder(params = {}) {
      const pts = [];
      const turns = params.turns ?? 3.2;
      const height = 1.6, radius = 0.5, steps = 140;
      const thickness = params.thickness ?? 0.075;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const a = t * Math.PI * 2 * turns;
        pts.push(new THREE.Vector3(Math.cos(a) * radius, (t - 0.5) * height, Math.sin(a) * radius));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      return new THREE.TubeGeometry(curve, 160, thickness, 8, false);
    }

    // Double-strand coil: two helix strands offset by π, merged into one
    // geometry so the shared weld/FPS path treats it as a single solid.
    function helixBuilder(params = {}) {
      const turns = params.turns ?? 2.5;
      const height = 1.6, radius = 0.5, steps = 120, tubeR = params.thickness ?? 0.09;
      const p1 = [], p2 = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const a = t * Math.PI * 2 * turns;
        const y = (t - 0.5) * height;
        p1.push(new THREE.Vector3(Math.cos(a) * radius, y, Math.sin(a) * radius));
        p2.push(new THREE.Vector3(Math.cos(a + Math.PI) * radius, y, Math.sin(a + Math.PI) * radius));
      }
      const c1 = new THREE.CatmullRomCurve3(p1);
      const c2 = new THREE.CatmullRomCurve3(p2);
      const g1 = new THREE.TubeGeometry(c1, 160, tubeR, 8, false);
      const g2 = new THREE.TubeGeometry(c2, 160, tubeR, 8, false);
      const a1 = g1.getAttribute('position'), a2 = g2.getAttribute('position');
      const arr = new Float32Array(a1.count * 3 + a2.count * 3);
      arr.set(a1.array, 0);
      arr.set(a2.array, a1.count * 3);
      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      g1.dispose(); g2.dispose();
      return merged;
    }

    // True N-sided pyramid with each triangular face tessellated into a dense
    // in-plane grid. ConeGeometry(…, 4, 1) welds to 6 vertices (FPS collapses
    // to a degenerate cluster); ConeGeometry(…, 4, H) is a 2-wide ladder grid.
    // Face tessellation gives FPS an isotropic point field → real triangles.
    // The subdivision count grows for low side counts so the welded vert set
    // stays ≥478 (builder-conformance rule).
    function buildPyramidGeometry(sides = 4) {
      sides = Math.max(3, Math.round(sides));
      const R = 0.5, y0 = -0.425;
      const apex = [0, 0.425, 0];
      const corners = [];
      for (let i = 0; i < sides; i++) {
        const a = (i * 360 / sides + 45) * Math.PI / 180;
        corners.push([Math.cos(a) * R, y0, Math.sin(a) * R]);
      }
      const pos = [];
      const sub = Math.max(16, Math.ceil(Math.sqrt(478 * 2 / sides)));
      const tri = (A, B, C) => {
        for (let i = 0; i < sub; i++) {
          for (let j = 0; j < sub - i; j++) {
            const p = (u, v) => [
              A[0] * (1 - u - v) + B[0] * u + C[0] * v,
              A[1] * (1 - u - v) + B[1] * u + C[1] * v,
              A[2] * (1 - u - v) + B[2] * u + C[2] * v,
            ];
            const p00 = p(i / sub, j / sub), p10 = p((i + 1) / sub, j / sub);
            const p01 = p(i / sub, (j + 1) / sub), p11 = p((i + 1) / sub, (j + 1) / sub);
            pos.push(...p00, ...p10, ...p01, ...p10, ...p11, ...p01);
          }
        }
      };
      for (let i = 0; i < sides; i++) tri(apex, corners[i], corners[(i + 1) % sides]);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      return geo;
    }

    const PROCEDURAL_BUILDERS = {
      cube:     () => new THREE.BoxGeometry(0.5, 0.5, 0.5, 16, 16, 16),
      cylinder: () => new THREE.CylinderGeometry(0.5, 0.5, 1.0, 32, 16),
      pyramid:  (p) => buildPyramidGeometry(p.sides),
      cone:     () => new THREE.ConeGeometry(0.5, 0.85, 32, 16),
      torus:    () => new THREE.TorusGeometry(0.45, 0.18, 32, 32),
      gem:      () => displacedIcosahedron('gem'),
      rock:     () => displacedIcosahedron('rock'),
      crystal:  () => displacedIcosahedron('crystal'),
      pebble:   () => displacedIcosahedron('pebble'),
      blob:     () => displacedIcosahedron('blob'),
      vase:     (p) => latheBuilder('vase', p),
      goblet:   (p) => latheBuilder('goblet', p),
      rocket:   (p) => latheBuilder('rocket', p),
      bowl:     (p) => latheBuilder('bowl', p),
      star:     (p) => extrudeBuilder('star', p),
      gear:     (p) => extrudeBuilder('gear', p),
      cross:    () => extrudeBuilder('cross'),
      hexagon:  () => extrudeBuilder('polygon', { sides: 6 }),
      polygon:  (p) => extrudeBuilder('polygon', p),
      knot:     () => new THREE.TorusKnotGeometry(0.4, 0.14, 96, 16),
      spiral:   (p) => spiralBuilder(p),
      helix:    (p) => helixBuilder(p),
    };
    const PROCEDURAL_NAMES = Object.keys(PROCEDURAL_BUILDERS);
    // G1: per-builder base scale so each name lands at its current absolute
    // size. Native primitives keep their geometry as-is (scale 1); everything
    // else is normalized to the 0.55r tier-0 bulk.
    const BASE_SCALES = {
      cube: 1, cylinder: 1, pyramid: 1, cone: 1, torus: 1,
    };
    const REF_RADIUS = 0.55;
    const SIZE_SCALES = { small: 0.7, medium: 1.0, large: 1.4 };
    const PROC_CACHE = new Map();

    function baseScaleFor(type, radius) {
      return BASE_SCALES[type] ?? (REF_RADIUS / (radius || REF_RADIUS));
    }

    // Cached base build. Key = (type, params) only — mods, blend, size, and
    // edges never touch the cache. `force` clears a base key.
    function getBase(type, params, force) {
      const key = `${type}:${JSON.stringify(params || {})}`;
      if (force) PROC_CACHE.delete(key);
      let entry = PROC_CACHE.get(key);
      if (!entry) {
        const builder = PROCEDURAL_BUILDERS[type];
        if (!builder) throw new Error(`Unknown object type: ${type}`);
        const geo = builder(params || {});
        const result = targetsFromGeometry(geo);
        geo.dispose();
        let radius = 0;
        for (const p of result.targets) radius = Math.max(radius, Math.hypot(p.x, p.y, p.z));
        entry = { targets: result.targets, radius };
        cachePut(key, entry);
      }
      return entry;
    }

    // Union base: merge two or more base geometries into one before the shared
    // weld → FPS step, so the 478-point net samples BOTH shapes' surfaces in a
    // single solid. Deterministic and cached under a composite key.
    function getUnionBase(parts, force) {
      const key = 'union:' + parts.map(p =>
        (typeof p === 'string' ? p : `${p.type}${JSON.stringify(p.params || {})}`)
      ).join('|');
      if (force) PROC_CACHE.delete(key);
      let entry = PROC_CACHE.get(key);
      if (!entry) {
        const posArrays = [];
        for (const part of parts) {
          const ref = typeof part === 'string' ? { type: part } : part;
          const builder = PROCEDURAL_BUILDERS[ref.type];
          if (!builder) throw new Error(`Unknown object type: ${ref.type}`);
          const geo = builder(ref.params || {});
          const attr = geo.getAttribute('position');
          posArrays.push(new Float32Array(attr.array));
          geo.dispose();
        }
        const total = posArrays.reduce((n, a) => n + a.length, 0);
        const arr = new Float32Array(total);
        let off = 0;
        for (const a of posArrays) { arr.set(a, off); off += a.length; }
        const merged = new THREE.BufferGeometry();
        merged.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        const result = targetsFromGeometry(merged);
        merged.dispose();
        let radius = 0;
        for (const p of result.targets) radius = Math.max(radius, Math.hypot(p.x, p.y, p.z));
        entry = { targets: result.targets, radius };
        cachePut(key, entry);
      }
      return entry;
    }

    // Compound base (A1): assemble a form from `parts`. Each part builds
    // through the same PROCEDURAL_BUILDERS, then gets its per-part transform
    // applied on the raw position array BEFORE the shared weld → FPS step — the
    // same mechanism as `union`/`helix`, so the 478-point net samples every
    // part's surface in one solid. All transforms are pointwise and
    // deterministic, so the composite caches under one key.
    //
    // Legibility grammar (A2):
    //   - First part is the ANCHOR — it sits at the origin; every later part's
    //     pos is relative to it.
    //   - rot uses the orientation vocabulary 'up'|'flat'|'side' (never raw
    //     Euler angles), with an optional {preset, deg} spin about the part's
    //     local up axis.
    //   - ≤12 parts; pos is clamped into the ±1.4r work volume so k-NN edges
    //     never bridge distant islands.
    const ROT_PRESETS = {
      up:   [0, 0, 0],
      flat: [Math.PI / 2, 0, 0],   // lay down along Z (vertical shape → on its side)
      side: [0, 0, Math.PI / 2],   // lay down along X
    };
    const WORK_VOLUME = 0.8; // ~1.45 × the 0.55r reference bulk

    function rotatePointsArr(arr, rx, ry, rz) {
      const cx = Math.cos(rx), sx = Math.sin(rx);
      const cy = Math.cos(ry), sy = Math.sin(ry);
      const cz = Math.cos(rz), sz = Math.sin(rz);
      for (let i = 0; i < arr.length; i += 3) {
        let x = arr[i], y = arr[i + 1], z = arr[i + 2];
        const y2 = y * cx - z * sx, z2 = y * sx + z * cx;
        y = y2; z = z2;
        const x2 = x * cz - y * sz, y3 = x * sz + y * cz;
        x = x2; y = y3;
        const x3 = x * cy + z * sy, z3 = -x * sy + z * cy;
        arr[i] = x3; arr[i + 1] = y; arr[i + 2] = z3;
      }
    }

    function applyModsFlat(arr, mods, seed) {
      const pts = new Array(arr.length / 3);
      for (let i = 0; i < pts.length; i++) pts[i] = { x: arr[i * 3], y: arr[i * 3 + 1], z: arr[i * 3 + 2] };
      applyMods(pts, mods, seed);
      for (let i = 0; i < pts.length; i++) { arr[i * 3] = pts[i].x; arr[i * 3 + 1] = pts[i].y; arr[i * 3 + 2] = pts[i].z; }
    }

    // Pointwise transform for one compound part: mods (local frame) → scale →
    // rotate (preset + spin) → translate (clamped into the work volume).
    function applyPartTransform(arr, part) {
      if (part.mods && Object.keys(part.mods).length) applyModsFlat(arr, part.mods, part.seed ?? 0);
      let sx = 1, sy = 1, sz = 1;
      if (typeof part.scale === 'number') { sx = sy = sz = part.scale; }
      else if (Array.isArray(part.scale)) { sx = part.scale[0] ?? 1; sy = part.scale[1] ?? 1; sz = part.scale[2] ?? 1; }
      let rx = 0, ry = 0, rz = 0;
      const rot = part.rot ?? 'up';
      if (typeof rot === 'string') { const p = ROT_PRESETS[rot]; if (p) { rx = p[0]; rz = p[2]; } }
      else if (rot && typeof rot === 'object') {
        const p = ROT_PRESETS[rot.preset || 'up'];
        if (p) { rx = p[0]; rz = p[2]; }
        ry = ((Number(rot.deg) || 0) * Math.PI) / 180;
      }
      if (rx || ry || rz) rotatePointsArr(arr, rx, ry, rz);
      let px = part.pos?.[0] ?? 0, py = part.pos?.[1] ?? 0, pz = part.pos?.[2] ?? 0;
      const m = Math.hypot(px, py, pz);
      if (m > WORK_VOLUME) { px *= WORK_VOLUME / m; py *= WORK_VOLUME / m; pz *= WORK_VOLUME / m; }
      for (let i = 0; i < arr.length; i += 3) {
        arr[i] = arr[i] * sx + px;
        arr[i + 1] = arr[i + 1] * sy + py;
        arr[i + 2] = arr[i + 2] * sz + pz;
      }
    }

    function getCompoundBase(parts, force) {
      const key = 'compound:' + parts.map(p => JSON.stringify({
        type: p.type, params: p.params || {}, pos: p.pos || [0, 0, 0],
        rot: p.rot || 'up', scale: p.scale || 1, mods: p.mods || {}, seed: p.seed ?? 0,
      })).join('|');
      if (force) PROC_CACHE.delete(key);
      let entry = PROC_CACHE.get(key);
      if (!entry) {
        const posArrays = [];
        for (const part of parts) {
          const builder = PROCEDURAL_BUILDERS[part.type];
          if (!builder) throw new Error(`Unknown object type: ${part.type}`);
          const geo = builder(part.params || {});
          const arr = new Float32Array(geo.getAttribute('position').array);
          geo.dispose();
          applyPartTransform(arr, part);
          posArrays.push(arr);
        }
        const total = posArrays.reduce((n, a) => n + a.length, 0);
        const arr = new Float32Array(total);
        let off = 0;
        for (const a of posArrays) { arr.set(a, off); off += a.length; }
        const merged = new THREE.BufferGeometry();
        merged.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        const result = targetsFromGeometry(merged);
        merged.dispose();
        let radius = 0;
        for (const p of result.targets) radius = Math.max(radius, Math.hypot(p.x, p.y, p.z));
        entry = { targets: result.targets, radius };
        cachePut(key, entry);
      }
      return entry;
    }

    // Cache is bounded (compound specs can be high-cardinality): evict the
    // oldest entry past the cap so a long voice session stays light.
    function cachePut(key, entry) {
      PROC_CACHE.set(key, entry);
      if (PROC_CACHE.size > 80) {
        const oldest = PROC_CACHE.keys().next().value;
        PROC_CACHE.delete(oldest);
      }
    }

    function scaleTargets(targets, s) {
      for (const p of targets) { p.x *= s; p.y *= s; p.z *= s; }
      return targets;
    }

    function copyTargets(targets) {
      return targets.map(p => ({ x: p.x, y: p.y, z: p.z }));
    }

    // ─── Modifiers on target arrays (not geometry) ────────────────────────
    // Pointwise, topology-independent, applied post-FPS in fixed order
    // squash → bend → twist → taper → bulge → spherize → jitter. Each is a
    // function of the point's normalized height (or plain coordinates), so a
    // 478-point pass stays ~1ms. Works in place on the target copy.
    function normHeight(pts) {
      let maxY = 1e-6;
      for (const p of pts) maxY = Math.max(maxY, Math.abs(p.y));
      return (p) => Math.max(-1, Math.min(1, p.y / maxY));
    }
    function squashPoints(pts, kx, ky, kz) {
      for (const p of pts) { p.x *= kx; p.y *= ky; p.z *= kz; }
    }
    function bendPoints(pts, r) {
      const nh = normHeight(pts);
      for (const p of pts) p.x += r * nh(p) * nh(p);
    }
    function twistPoints(pts, deg) {
      const nh = normHeight(pts);
      const rad = deg * Math.PI / 180;
      for (const p of pts) {
        const a = nh(p) * rad;
        const c = Math.cos(a), s = Math.sin(a);
        const x = p.x, z = p.z;
        p.x = x * c - z * s;
        p.z = x * s + z * c;
      }
    }
    function taperPoints(pts, k) {
      const nh = normHeight(pts);
      for (const p of pts) {
        const f = 1 - k * ((nh(p) + 1) / 2);
        p.x *= f; p.z *= f;
      }
    }
    function bulgePoints(pts, k) {
      const nh = normHeight(pts);
      for (const p of pts) {
        const f = 1 + k * (1 - nh(p) * nh(p));
        p.x *= f; p.z *= f;
      }
    }
    function spherizePoints(pts, k) {
      let meanR = 0;
      for (const p of pts) meanR += Math.hypot(p.x, p.y, p.z);
      meanR /= pts.length || 1;
      for (const p of pts) {
        const l = Math.hypot(p.x, p.y, p.z) || 1e-6;
        const t = l + (meanR - l) * k;
        p.x *= t / l; p.y *= t / l; p.z *= t / l;
      }
    }
    function jitterPoints(pts, amp, seed) {
      const s = (typeof seed === 'number' ? seed : hashString(String(seed ?? 'surprise'))) >>> 0;
      for (let i = 0; i < pts.length; i++) {
        const rng = mulberry32((s + i * 7919) >>> 0);
        pts[i].x += (rng() - 0.5) * amp;
        pts[i].y += (rng() - 0.5) * amp;
        pts[i].z += (rng() - 0.5) * amp;
      }
    }
    function applyMods(pts, mods, seed) {
      if (mods.squash) squashPoints(pts, mods.squash.kx ?? 1, mods.squash.ky ?? 1, mods.squash.kz ?? 1);
      if (mods.bend) bendPoints(pts, typeof mods.bend === 'object' ? (mods.bend.r ?? 0) : mods.bend);
      if (mods.twist) twistPoints(pts, typeof mods.twist === 'object' ? (mods.twist.deg ?? 0) : mods.twist);
      if (mods.taper) taperPoints(pts, typeof mods.taper === 'object' ? (mods.taper.k ?? 0) : mods.taper);
      if (mods.bulge) bulgePoints(pts, typeof mods.bulge === 'object' ? (mods.bulge.k ?? 0) : mods.bulge);
      if (mods.spherize) spherizePoints(pts, typeof mods.spherize === 'object' ? (mods.spherize.k ?? 0) : mods.spherize);
      if (mods.jitter) jitterPoints(pts, typeof mods.jitter === 'object' ? (mods.jitter.amp ?? 0) : mods.jitter, seed);
      return pts;
    }

    // ─── Blend morphing ───────────────────────────────────────────────────
    // Pure 478-point lerp over cached bases. Both bases are size-normalized
    // to a common reference before lerp — B is scaled to A's radius, so
    // ratio=0 ≈ A exactly (G1) and the size is applied after.
    function blendTargets(A, B, ratio) {
      const bScale = A.radius / (B.radius || 1e-6);
      const out = new Array(NUM);
      for (let i = 0; i < NUM; i++) {
        const ax = A.targets[i].x, ay = A.targets[i].y, az = A.targets[i].z;
        out[i] = {
          x: ax + (B.targets[i].x * bScale - ax) * ratio,
          y: ay + (B.targets[i].y * bScale - ay) * ratio,
          z: az + (B.targets[i].z * bScale - az) * ratio,
        };
      }
      return out;
    }

    // Turn a spec into final 478-point targets and swap in the shared globals.
    function buildProceduralTargets(spec, force) {
      // Route: v2 SDF grammar → schema-2 path; else parts → compound; else
      // union; else single type (A1).
      if (spec.schema === 2 && spec.root) {
        const key = 'v2:' + hashString(JSON.stringify(spec.root)) + ':' + (spec.seed ?? 0);
        if (force) PROC_CACHE.delete(key);
        let entry = PROC_CACHE.get(key);
        if (!entry) {
          entry = targetsFromSDF(spec.root, spec.seed ?? 0);
          cachePut(key, entry);
        }
        let targets = copyTargets(entry.targets);
        // v2 forms normalize to the reference bulk like compounds/unions (G1);
        // the surface is order-aligned by direction already, so no FPS.
        const baseScale = REF_RADIUS / (entry.radius || 1e-6);
        if (baseScale !== 1) scaleTargets(targets, baseScale);
        if (spec.mods && Object.keys(spec.mods).length) applyMods(targets, spec.mods, spec.seed);
        const ss = SIZE_SCALES[spec.size || 'medium'] || 1.0;
        if (ss !== 1.0) scaleTargets(targets, ss);
        const fpsEdges = nearestNeighborEdges(targets, 6);
        shapeTargets = targets;
        shapeTargetEdgeIndices = [];
        for (const [a, b] of fpsEdges) shapeTargetEdgeIndices.push(a, b);
        return targets;
      }
      const isCompound = Array.isArray(spec.parts) && spec.parts.length > 0;
      const isUnion = !isCompound && Array.isArray(spec.union) && spec.union.length >= 2;
      const A = isCompound
        ? getCompoundBase(spec.parts, force)
        : (isUnion ? getUnionBase(spec.union, force) : getBase(spec.type, spec.params, force));
      let targets;
      if (spec.blend && PROCEDURAL_NAMES.includes(spec.blend.with) && spec.blend.with !== spec.type) {
        const B = getBase(spec.blend.with, undefined, force);
        targets = blendTargets(A, B, Math.max(0, Math.min(1, spec.blend.ratio ?? 0.5)));
      } else {
        targets = copyTargets(A.targets);
      }
      // Compounds and unions are new composite forms → normalize to the
      // reference bulk like any non-native builder (G1 applies to the member
      // names individually).
      const baseScale = (isCompound || isUnion) ? (REF_RADIUS / A.radius) : baseScaleFor(spec.type, A.radius);
      if (baseScale !== 1) scaleTargets(targets, baseScale);
      if (spec.mods && Object.keys(spec.mods).length) applyMods(targets, spec.mods, spec.seed);
      const ss = SIZE_SCALES[spec.size || 'medium'] || 1.0;
      if (ss !== 1.0) scaleTargets(targets, ss);
      const fpsEdges = nearestNeighborEdges(targets, 6);
      shapeTargets = targets;
      shapeTargetEdgeIndices = [];
      for (const [a, b] of fpsEdges) shapeTargetEdgeIndices.push(a, b);
      return targets;
    }

    async function spawnObject(spec, legacySize, legacyOpts = {}) {
      if (typeof spec === 'string') spec = { type: spec, size: legacySize || 'medium', ...legacyOpts };
      const type = spec.type;
      if (type === 'face' || type === 'sphere' || type === 'model') {
        interruptMorph();
        await switchShape(type, spec);
        return type;
      }
      const targets = buildProceduralTargets(spec, legacyOpts.force);
      currentShape = spec.id || (Array.isArray(spec.parts) ? 'compound' : type);
      window.__scene.spec = spec;
      interruptMorph();
      morphTo(type, targets);
      return type;

    function getCuratedSpec(name) {
      const key = String(name || '').toLowerCase().trim();
      let spec = CURATED_SPECS[key] || CURATED_SPECS[CURATED_ALIASES[key]?.find(a => a === key)];
      if (!spec) {
        // Substring pass: "a golden hourglass" or "stone arch" resolves by its
        // contained concept word — the voice agent keeps concepts concise, so
        // collisions stay rare.
        for (const [id, aliases] of Object.entries(CURATED_ALIASES)) {
          if (aliases.some(a => key.includes(a) && a.length >= 3)) { spec = CURATED_SPECS[id]; break; }

    // Spawn a curated spec through the standard pipeline (same path as pills
    // and voice). Returns the id or null if the concept isn't in the library.
    async function spawnCurated(name, size) {
